<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <title>Geo Quest</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overscroll-behavior: none; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(ellipse at top, #0c4a6e 0%, #0f172a 65%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 12px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body.shake { animation: shake 0.45s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .top-bar {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .back-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:active { background: rgba(255,255,255,0.14); }
        .top-controls { display: flex; gap: 6px; }
        .icon-btn {
            background: rgba(255,255,255,0.06);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 1.1rem;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
        }
        .icon-btn:active { transform: scale(0.94); }

        .hud {
            width: 100%;
            max-width: 720px;
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hud-chip.pop { animation: pop 0.45s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .hud-chip.stars { color: #fde047; border-color: rgba(253,224,71,0.4); }
        .hud-chip.coins { color: #fbbf24; border-color: rgba(251,191,36,0.4); }

        .screen {
            display: none;
            width: 100%;
            max-width: 720px;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: screen-in 0.35s ease;
        }
        .screen.active { display: flex; }
        @keyframes screen-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1.title {
            margin: 0;
            font-size: 1.75rem;
            text-align: center;
            background: linear-gradient(180deg, #fde68a, #fbbf24 60%, #d97706);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .tagline { color: #94a3b8; font-size: 0.85rem; margin: -4px 0 8px; }

        .hub-scene {
            position: relative;
            width: min(96vw, 400px);
            aspect-ratio: 1;
            margin: 0 auto 10px;
            flex-shrink: 0;
            overflow: visible;
        }
        .hub-scene.flight { overflow: hidden; }
        .globe-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 58%;
            height: 58%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            z-index: 2;
            will-change: transform;
        }
        .globe-canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: grab;
            touch-action: none;
            box-shadow:
                0 0 40px rgba(56, 189, 248, 0.25),
                0 12px 28px rgba(0, 0, 0, 0.45);
        }
        .globe-canvas.dragging { cursor: grabbing; }
        .flight-vignette {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            background: radial-gradient(circle at 50% 48%, transparent 18%, rgba(0, 8, 24, 0.55) 72%, rgba(0, 0, 0, 0.88) 100%);
            transition: opacity 0.35s ease;
        }
        .hub-scene.flight .flight-vignette { opacity: 1; }
        .hub-scene.flight .orbit-ring {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .hub-scene.flight .globe-canvas {
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.45),
                0 20px 50px rgba(0, 0, 0, 0.55);
        }
        #screen-hub.flight-active .hub-actions,
        #screen-hub.flight-active .hub-footer,
        #screen-hub.flight-active .tagline {
            opacity: 0.25;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        .globe-canvas:focus-visible {
            outline: 2px solid #fbbf24;
            outline-offset: 4px;
        }
        .hub-scene::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 62%;
            height: 62%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.12), transparent 55%);
            pointer-events: none;
            z-index: 3;
        }
        .orbit-ring {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
        }
        .orbit-chip {
            position: absolute;
            pointer-events: auto;
            width: 76px;
            padding: 8px 6px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.18);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(6px);
            color: #f8fafc;
            cursor: pointer;
            text-align: center;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }
        .orbit-chip:active { transform: translate(-50%, -50%) scale(0.94); }
        .orbit-chip .em { display: block; font-size: 1.35rem; line-height: 1.1; }
        .orbit-chip .nm {
            display: block;
            font-size: 0.62rem;
            line-height: 1.2;
            color: #cbd5e1;
            margin-top: 3px;
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .orbit-chip .pr { display: block; font-size: 0.65rem; color: #fde047; margin-top: 2px; }
        .orbit-chip.locked { opacity: 0.55; }
        .orbit-chip.highlight {
            border-color: #fbbf24;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
        }
        .orbit-chip.pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.45); }
            50% { box-shadow: 0 0 0 8px rgba(251,191,36,0); }
        }
        @media (min-width: 400px) {
            .orbit-chip { width: 84px; }
            .orbit-chip .nm { font-size: 0.68rem; max-width: 80px; }
        }

        .hub-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(180deg, #22c55e, #15803d); }
        .btn-secondary { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }

        .hub-footer {
            width: 100%;
            max-width: 720px;
            display: flex;
            justify-content: space-around;
            font-size: 0.8rem;
            color: #94a3b8;
            padding-top: 4px;
        }

        .map-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .map-header h2 { margin: 0; font-size: 1.25rem; flex: 1; text-align: center; }

        .map-scroll {
            width: 100%;
            max-width: 720px;
            max-height: min(72vh, 640px);
            overflow-y: auto;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.12);
            background: #0c4a6e;
        }
        .map-scroll.ocean-adventure {
            border-color: rgba(251, 191, 36, 0.35);
            box-shadow: inset 0 0 40px rgba(6, 42, 71, 0.6);
        }
        .map-scroll.ocean-adventure .map-geo.context {
            fill: rgba(14, 116, 144, 0.2);
        }
        .map-scroll.ocean-adventure .map-geo.playable {
            fill: rgba(56, 189, 248, 0.18);
            stroke: rgba(186, 230, 253, 0.45);
        }
        .map-svg { width: 100%; height: auto; display: block; }
        .map-geo {
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 1.2;
            stroke-linejoin: round;
            transition: fill 0.2s;
        }
        .map-geo.context {
            fill: rgba(71, 85, 105, 0.45);
        }
        .map-geo.playable {
            fill: rgba(56, 189, 248, 0.42);
            stroke: rgba(186, 230, 253, 0.75);
            stroke-width: 1.5;
        }
        .map-geo.playable.done {
            fill: rgba(34, 197, 94, 0.48);
        }
        .map-island {
            fill: #fde68a;
            stroke: #b45309;
            stroke-width: 0.9;
            stroke-linejoin: round;
        }
        .map-island.tiny {
            fill: #fef3c7;
            stroke-width: 0.6;
        }
        .map-bermuda {
            fill: rgba(168, 85, 247, 0.22);
            stroke: #e879f9;
            stroke-width: 2;
            stroke-dasharray: 8 5;
            animation: bermudaPulse 2.5s ease-in-out infinite;
        }
        @keyframes bermudaPulse {
            0%, 100% { fill: rgba(168, 85, 247, 0.18); }
            50% { fill: rgba(168, 85, 247, 0.32); }
        }
        .map-bermuda-label {
            fill: #f5d0fe;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-treasure text {
            font-size: 20px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .map-treasure .treasure-glow {
            fill: rgba(251, 191, 36, 0.35);
            stroke: #fbbf24;
            stroke-width: 1.5;
            animation: treasureGlow 1.8s ease-in-out infinite;
        }
        @keyframes treasureGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .treasure-scroll-icon {
            fill: #fef9c3;
            stroke: #ca8a04;
            stroke-width: 1.2;
        }
        .map-node {
            cursor: pointer;
        }
        .map-node .node-inner {
            transition: opacity 0.12s ease;
        }
        .map-node:active .node-inner {
            opacity: 0.82;
        }
        .map-node .node-hit {
            fill: transparent;
            stroke: none;
            cursor: pointer;
            pointer-events: all;
        }
        .map-node .node-bg {
            stroke: #fff;
            stroke-width: 3.5;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
            pointer-events: none;
        }
        .map-node.locked .node-bg { fill: #64748b; }
        .map-node.available .node-bg { fill: #22c55e; }
        .map-node.current .node-bg { fill: #fbbf24; animation: pulse 1.2s infinite; }
        .map-node.done-1 .node-bg { fill: #eab308; }
        .map-node.done-2 .node-bg { fill: #f59e0b; }
        .map-node.done-3 .node-bg { fill: #f97316; }
        .map-node .node-emoji {
            fill: #fff;
            font-size: 28px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .map-node .node-label {
            fill: #e2e8f0;
            font-size: 12px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-node .node-stars {
            fill: #fde68a;
            font-size: 14px;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-node--lg .node-bg { stroke-width: 4; }
        .map-node--lg .node-emoji { font-size: 32px; }
        .map-node--lg .node-label { font-size: 13px; }
        .trail {
            fill: none;
            stroke: rgba(253, 224, 71, 0.55);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 10 8;
        }

        .game-header {
            width: 100%;
            text-align: center;
        }
        .game-location { font-weight: 700; font-size: 1rem; }
        .round-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .round-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .round-dots .dot.done { background: #22c55e; }
        .round-dots .dot.current { background: #fbbf24; transform: scale(1.2); }

        .mentor {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            font-size: 0.9rem;
            color: #bbf7d0;
        }
        .prompt {
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.35;
            padding: 8px 4px;
        }
        .media { width: 100%; text-align: center; }
        .media img { max-width: 100%; max-height: 200px; border-radius: 12px; }

        .answers.image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .answer-img-btn {
            padding: 8px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #f8fafc;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .answer-img-btn:active { background: rgba(255,255,255,0.16); }
        .answer-img-btn img {
            width: 100%;
            max-height: 118px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            pointer-events: none;
        }
        .answers.image-grid.fit-contain .answer-img-btn {
            padding: 10px;
            min-height: 148px;
            justify-content: center;
        }
        .answers.image-grid.fit-contain .answer-img-btn img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 128px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.06);
        }
        .answer-img-btn span {
            font-size: 0.82rem;
            font-weight: 600;
            pointer-events: none;
        }
        .answer-img-btn.no-labels span {
            display: none;
        }
        .answer-img-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.28); }
        .answer-img-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.28); }
        .answer-img-btn:disabled { opacity: 0.65; cursor: default; }
        .answer-img-btn.img-missing {
            opacity: 0.35;
            pointer-events: none;
        }

        .feedback-explanation { margin: 0 0 10px; line-height: 1.45; }
        .explanation-media { margin-top: 10px; text-align: center; }
        .explanation-media-link {
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            line-height: 0;
        }
        .explanation-media-link img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 2px solid rgba(251, 191, 36, 0.45);
            transition: transform 0.15s ease;
        }
        .explanation-media-link:active img { transform: scale(0.98); }
        .explanation-media-caption { margin: 8px 0 0; font-size: 0.88rem; }
        .explanation-media-caption a { color: #fde68a; text-decoration: underline; }
        #modal-feedback .modal { max-width: min(420px, 94vw); }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .answer-btn {
            padding: 16px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .answer-btn:active { background: rgba(255,255,255,0.18); }
        .answer-btn.correct { background: rgba(34,197,94,0.35); border-color: #22c55e; }
        .answer-btn.wrong { background: rgba(239,68,68,0.35); border-color: #ef4444; }
        .answer-btn:disabled { opacity: 0.7; pointer-events: none; }

        .answers.yesno { flex-direction: row; }
        .answers.yesno .answer-btn { flex: 1; }

        .map-tap-svg {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            border-radius: 12px;
            background: rgba(15,23,42,0.5);
        }
        .map-tap-svg path {
            fill: rgba(56,189,248,0.35);
            stroke: #7dd3fc;
            stroke-width: 2;
            cursor: pointer;
        }
        .map-tap-svg path:hover, .map-tap-svg path:focus { fill: rgba(251,191,36,0.5); }
        .map-tap-svg path.highlight { fill: rgba(34,197,94,0.6); }

        .combo-banner {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #f59e0b, #eab308);
            color: #1e293b;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 99px;
            z-index: 50;
            animation: screen-in 0.3s;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.active { display: flex; }
        .modal {
            background: linear-gradient(180deg, #1e3a5f, #0f172a);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .modal h3 { margin: 0 0 10px; font-size: 1.25rem; }
        .modal p { color: #cbd5e1; margin: 0 0 16px; line-height: 1.4; }
        .modal .stars-big { font-size: 2rem; letter-spacing: 4px; margin: 8px 0; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            background: #3b82f6;
            color: white;
        }
        .modal-btn:active { opacity: 0.9; }

        .flash {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            opacity: 0;
        }
        .flash.correct { animation: flash-in 0.35s; background: rgba(34,197,94,0.25); }
        .flash.wrong { animation: flash-in 0.35s; background: rgba(239,68,68,0.2); }
        .flash.win { animation: flash-in 0.5s; background: rgba(251,191,36,0.2); }
        @keyframes flash-in {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: -20px;
            z-index: 60;
            animation: fall 2.5s forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 80;
            font-size: 0.9rem;
        }

        @media (min-width: 560px) {
            .answers.grid { display: grid; grid-template-columns: 1fr 1fr; }
        }

        .map-node.bonus-node .node-bg {
            fill: #a855f7;
            stroke: #f5d0fe;
        }
        .map-node.bonus-node.current .node-bg {
            fill: #fbbf24;
            animation: pulse 1.2s infinite;
        }

        .answers.puzzle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        .puzzle-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }
        .puzzle-toolbar .puzzle-stat {
            font-size: 0.88rem;
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
        }
        .puzzle-toolbar .btn-mini {
            padding: 8px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.1);
            color: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .puzzle-toolbar .btn-mini:active { transform: scale(0.97); }
        .puzzle-board {
            display: grid;
            gap: 3px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 5 / 4;
            padding: 6px;
            border-radius: 14px;
            background: rgba(0,0,0,0.35);

            margin: 0;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.2);

    </style>
</head>

<script>
(function () {
    "use strict";

    const STORAGE_KEY = "geoQuest:v1";
    const UNLOCK_MIN_STARS = 2;
    const MAX_STARS_TOTAL = 30;

    /** Lat/lon bounds for picking continents on the globe (approximate). */
    const LAND_PICKERS = [
        { id: "antarctica", test(lat, lon) { return lat < -60; } },
        { id: "oceania", test(lat, lon) { return lat >= -50 && lat <= 12 && lon >= 95 && lon <= 180; } },
        { id: "south-america", test(lat, lon) { return lat >= -56 && lat <= 15 && lon >= -82 && lon <= -34; } },
        { id: "north-america", test(lat, lon) { return lat >= 12 && lat <= 72 && lon >= -170 && lon <= -52; } },
        { id: "europe", test(lat, lon) { return lat >= 36 && lat <= 72 && lon >= -30 && lon <= 60; } },
        { id: "africa", test(lat, lon) { return lat >= -35 && lat <= 37 && lon >= -20 && lon <= 52; } },
        {
            id: "asia",
            test(lat, lon) {
                if (lat < -8 || lat > 77) return false;
                return (lon >= 25 && lon <= 180) || (lon >= -180 && lon <= -168);
            }
        }
    ];

    const PRAISE = [
        "Чудово, досліднику!",
        "Саме так! Ти на карті!",
        "Відмінна географія!",
        "Капітан гордиться!",
        "Ще одна перемога!"
    ];
    const ENCOURAGE = [
        "Нічого страшного — вчимося разом!",
        "Ось підказка:",
        "Спробуй ще раз наступного разу!",
        "Головне — запам’ятати:"
    ];

    const DEFAULT_SAVE = {
        version: 1,
        coins: 0,
        totalStars: 0,
        comboBest: 0,
        soundOn: true,
        voiceOn: false,
        lastPlayed: null,
        continents: {},
        badges: []
    };

    const hubScreen = document.getElementById("screen-hub");
    const mapScreen = document.getElementById("screen-map");
    const gameScreen = document.getElementById("screen-game");
    const screens = [hubScreen, mapScreen, gameScreen];

    const starsCountEl = document.getElementById("stars-count");
    const coinsCountEl = document.getElementById("coins-count");
    const hubScene = document.getElementById("hub-scene");
    const orbitRing = document.getElementById("orbit-ring");
    const globeWrap = document.getElementById("globe-wrap");
    const globeCanvas = document.getElementById("globe-canvas");
    const mapSvg = document.getElementById("map-svg");
    const mapTitle = document.getElementById("map-title");
    const gameLocation = document.getElementById("game-location");
    const roundDots = document.getElementById("round-dots");
    const mentorBubble = document.getElementById("mentor-bubble");
    const gamePrompt = document.getElementById("game-prompt");
    const gameMedia = document.getElementById("game-media");
    const gameAnswers = document.getElementById("game-answers");
    const flashEl = document.getElementById("flash");
    const soundToggle = document.getElementById("sound-toggle");
    const voiceToggle = document.getElementById("voice-toggle");

    const gameBase = (() => {
        const m = location.pathname.match(/^(.*\/games\/[^/]+)/);
        return (m ? m[1] : location.pathname.replace(/\/[^/]*$/, "")) + "/";
    })();
    const url = (p) => gameBase + p.replace(/^\//, "");

    function loadSave() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
            return { ...DEFAULT_SAVE, ...JSON.parse(raw) };
        } catch (_) {
            return JSON.parse(JSON.stringify(DEFAULT_SAVE));
        }
    }
    function saveSave() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); } catch (_) {}
    }
    const save = loadSave();

    const audio = (() => {
        let ctx = null;
        function ensure() {
            if (!ctx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();
            }
            if (ctx.state === "suspended") ctx.resume();
            return ctx;
        }
        function tone(freq, dur, type = "sine", gain = 0.12, when = 0) {
            if (!save.soundOn) return;
            const c = ensure();
            if (!c) return;
            const t0 = c.currentTime + when;
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            g.gain.setValueAtTime(0, t0);
            g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g).connect(c.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }
        return {
            tap: () => tone(660, 0.05, "triangle", 0.08),
            select: () => { tone(523, 0.08, "triangle", 0.1); tone(784, 0.1, "triangle", 0.1, 0.05); },
            correct: () => [659, 880, 1175].forEach((f, i) => tone(f, 0.18, "triangle", 0.12, i * 0.07)),
            wrong: () => { tone(220, 0.22, "sawtooth", 0.1); tone(165, 0.34, "sawtooth", 0.09, 0.08); },
            star: () => { tone(1175, 0.1); tone(1760, 0.14, "sine", 0.1, 0.06); },
            coin: () => { tone(880, 0.08, "square", 0.08); tone(1320, 0.12, "square", 0.08, 0.05); },
            win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, "triangle", 0.12, i * 0.1))
        };
    })();

    const voice = (() => {
        const supported = "speechSynthesis" in window;
        let ukVoice = null;
        function pick() {
            if (!supported) return;
            ukVoice = speechSynthesis.getVoices().find(v => /^uk/i.test(v.lang)) || null;
        }
        if (supported) {
            pick();
            speechSynthesis.onvoiceschanged = pick;
        }
        return {
            speak(text) {
                if (!supported || !save.voiceOn || !text) return;
                try {
                    speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = "uk-UA";
                    if (ukVoice) u.voice = ukVoice;
                    speechSynthesis.speak(u);
                } catch (_) {}
            },
            stop() {
                if (supported) try { speechSynthesis.cancel(); } catch (_) {}
            }
        };
    })();

    function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
        }
        return copy;
    }

    /** Shuffle answer options each time a round is shown (new order on replay). */
    function prepareRoundChoices(round) {
        if (!round) return null;
        if (round.type === "yesno") {
            return shuffleArray([
                { label: "Так", value: true },
                { label: "Ні", value: false },
            ]);
        }
        if (round.type === "imageQuiz" && round.answers) {
            return shuffleArray(
                round.answers.map((ans, idx) => ({
                    label: ans.label || "",
                    image: ans.image,
                    isCorrect: idx === round.correct,
                }))
            );
        }
        if (round.answers && typeof round.correct === "number") {
            return shuffleArray(
                round.answers.map((text, idx) => ({
                    text: text,
                    isCorrect: idx === round.correct,
                }))
            );
        }
        return null;
    }
    function flash(kind) {
        flashEl.className = "flash " + kind;
        void flashEl.offsetWidth;
        setTimeout(() => { flashEl.className = "flash"; }, 400);
    }
    function shake() {
        document.body.classList.remove("shake");
        void document.body.offsetWidth;
        document.body.classList.add("shake");
        setTimeout(() => document.body.classList.remove("shake"), 450);
    }
    function confetti(n = 28) {
        const em = ["🎉", "⭐", "🪙", "🌍", "✨"];
        for (let i = 0; i < n; i++) {
            const el = document.createElement("span");
            el.className = "confetti";
            el.textContent = em[i % em.length];
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = 14 + Math.random() * 16 + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }
    }
    function toast(msg) {
        const el = document.createElement("div");
        el.className = "toast-msg";
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }
    function showComboBanner(text) {
        const el = document.createElement("div");
        el.className = "combo-banner";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
    }

    function continentSave(id) {
        if (!save.continents[id]) save.continents[id] = { nodes: {} };
        return save.continents[id];
    }
    function nodeStars(continentId, nodeId) {
        return save.continents[continentId]?.nodes[nodeId]?.stars || 0;
    }
    function recalcTotalStars() {
        let t = 0;
        for (const cid in save.continents) {
            const nodes = save.continents[cid].nodes || {};
            for (const nid in nodes) t += nodes[nid].stars || 0;
        }
        save.totalStars = t;
    }
    function updateHud(animate) {
        starsCountEl.textContent = save.totalStars;
        coinsCountEl.textContent = save.coins;
        document.getElementById("footer-stars").textContent =
            "Зірки: " + save.totalStars + " / " + MAX_STARS_TOTAL;
        document.getElementById("footer-badges").textContent =
            "Бейджі: " + (save.badges?.length || 0);
        if (animate === "stars") {
            starsCountEl.parentElement.classList.remove("pop");
            void starsCountEl.parentElement.offsetWidth;
            starsCountEl.parentElement.classList.add("pop");
        }
        if (animate === "coins") {
            coinsCountEl.parentElement.classList.remove("pop");
            void coinsCountEl.parentElement.offsetWidth;
            coinsCountEl.parentElement.classList.add("pop");
        }
    }

    soundToggle.addEventListener("click", () => {
        save.soundOn = !save.soundOn;
        saveSave();
        soundToggle.textContent = save.soundOn ? "🔊" : "🔇";
        if (save.soundOn) audio.tap();
    });
    voiceToggle.addEventListener("click", () => {
        save.voiceOn = !save.voiceOn;
        saveSave();
        voiceToggle.textContent = save.voiceOn ? "🗣️" : "🔇";
        if (save.voiceOn) voice.speak("Озвучка увімкнена");
        else voice.stop();
    });
    soundToggle.textContent = save.soundOn ? "🔊" : "🔇";
    voiceToggle.textContent = save.voiceOn ? "🗣️" : "🔇";

    function showScreen(el) {
        voice.stop();
        screens.forEach(s => s.classList.toggle("active", s === el));
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let world = null;
    const continentCache = {};
    const mapCache = {};
    const mapGeoCache = {};

    async function fetchJson(path) {
        const res = await fetch(url(path));
        if (!res.ok) throw new Error(path + " HTTP " + res.status);
        return res.json();
    }

    async function loadWorld() {
        if (world) return world;
        world = await fetchJson("data/world.json");
        return world;
    }

    async function loadContinentData(meta) {
        const key = meta.id;
        if (continentCache[key]) return continentCache[key];
        const data = await fetchJson(meta.file);
        if (data.nodes) {
            for (const node of data.nodes) {
                if (node.roundsFile) {
                    const extra = await fetchJson(node.roundsFile);
                    const extraRounds = extra.rounds || extra;
                    node.rounds = [...(node.rounds || []), ...extraRounds];
                }
            }
        }
        continentCache[key] = data;
        return data;
    }

    async function loadMap(mapId) {
        if (mapCache[mapId]) return mapCache[mapId];
        const data = await fetchJson("data/maps/" + mapId + ".json");
        mapCache[mapId] = data;
        return data;
    }

    async function loadContinentGeo(continentData) {
        const geoFile = continentData.map?.geoFile;
        if (!geoFile) return null;
        if (mapGeoCache[continentData.id]) return mapGeoCache[continentData.id];
        const data = await fetchJson(geoFile);
        mapGeoCache[continentData.id] = data;
        return data;
    }

    function nodeGeoId(node) {
        return node.countryId || node.regionId || node.id;
    }

    function findGeoFeature(geo, node) {
        if (!geo) return null;
        const id = nodeGeoId(node);
        const list = geo.countries || geo.regions || [];
        return list.find(f => f.id === id) || null;
    }

    const MAP_MARKER_PAD = 58;

    function clampMapPoint(x, y, w, h, pad) {
        return {
            x: Math.min(w - pad, Math.max(pad, x)),
            y: Math.min(h - pad, Math.max(pad, y)),
        };
    }

    function getNodeCenter(geo, node) {
        const f = findGeoFeature(geo, node);
        const pt = (f && (f.marker || f.center)) || null;
        if (!pt) return null;
        if (geo && geo.viewBox) {
            const vb = geo.viewBox.split(/\s+/).map(Number);
            const pad = geo.markerPadding ?? MAP_MARKER_PAD;
            return clampMapPoint(pt.x, pt.y, vb[2] || 1000, vb[3] || 780, pad);
        }
        return { x: pt.x, y: pt.y };
    }

    function buildFlexibleTrail(positions) {
        if (positions.length < 2) return "";
        const pts = positions.map(p => ({ x: p.x, y: p.y }));
        let d = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
        for (let i = 1; i < pts.length; i++) {
            const a = pts[i - 1];
            const b = pts[i];
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            const bend = Math.min(110, len * 0.42) * (i % 2 === 0 ? 1 : -1);
            const cx = mx + (-dy / len) * bend;
            const cy = my + (dx / len) * bend;
            d += " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " +
                b.x.toFixed(1) + "," + b.y.toFixed(1);
        }
        return d;
    }

    function renderMapNode(p, cls, stars, large) {
        const r = large ? 36 : 30;
        const hit = large ? 48 : 40;
        const node = p.node;
        const starTxt = stars > 0 ? "⭐".repeat(stars) : "";
        const label = node.title || "";
        let g = '<g class="map-node' + (large ? " map-node--lg" : "") +
            (node.bonus ? " bonus-node" : "") + " " + cls +
            '" data-id="' + node.id + '" transform="translate(' + p.x + "," + p.y + ')" pointer-events="all">';
        g += '<g class="node-inner">';
        g += '<circle class="node-bg" r="' + r + '" cx="0" cy="0"/>';
        g += '<text class="node-emoji" y="2">' + node.emoji + "</text>";
        if (label) {
            g += '<text class="node-label" y="' + (r + 22) + '">' + label + "</text>";
        }
        if (starTxt) {
            g += '<text class="node-stars" y="' + (-r - 14) + '">' + starTxt + "</text>";
        }
        g += '<circle class="node-hit" r="' + hit + '" cx="0" cy="0"/>';
        g += "</g></g>";
        return g;
    }

    function renderOceanMapLayers(geo, w, h) {
        let html = "";
        const grad = geo.backgroundGradient;
        if (grad && grad.length >= 2) {
            html += '<defs><linearGradient id="oceanSea" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="' + grad[0] + '"/>' +
                '<stop offset="55%" stop-color="' + (grad[1] || grad[0]) + '"/>' +
                '<stop offset="100%" stop-color="' + (grad[2] || grad[1] || grad[0]) + '"/>' +
                "</linearGradient></defs>";
            html += '<rect width="' + w + '" height="' + h + '" fill="url(#oceanSea)"/>';
        } else {
            html += '<rect width="' + w + '" height="' + h + '" fill="' +
                (geo.background || "#0c4a6e") + '"/>';
        }
        for (const isle of geo.islands || []) {
            const tiny = (isle.path || "").length < 80;
            html += '<path class="map-island' + (tiny ? " tiny" : "") + '" d="' + isle.path + '"/>';
        }
        return html;
    }

    function renderOceanDecorations(geo) {
        let html = "";
        for (const d of geo.decorations || []) {
            if (d.type === "bermudaTriangle" && d.path) {
                html += '<path class="map-bermuda" d="' + d.path + '"/>';
                const c = d.center;
                if (c) {
                    html += '<text class="map-bermuda-label" x="' + c.x + '" y="' + (c.y + 4) + '">' +
                        (d.title || "△") + "</text>";
                }
            } else if (d.type === "treasure") {
                const isMap = (d.title || "").indexOf("Карта") >= 0;
                const pad = geo.markerPadding ?? 44;
                const tx = Math.min((geo.projection?.width || 1200) - pad, Math.max(pad, d.x));
                const ty = Math.min((geo.projection?.height || 620) - pad, Math.max(pad, d.y));
                html += '<g class="map-treasure" transform="translate(' + tx + "," + ty + ')">';
                html += '<circle class="treasure-glow" r="18" cx="0" cy="0"/>';
                if (isMap) {
                    html += '<rect class="treasure-scroll-icon" x="-11" y="-14" width="22" height="26" rx="2"/>';
                    html += '<path fill="none" stroke="#92400e" stroke-width="1" d="M-6 -6 L6 2 M-6 2 L4 8"/>';
                    html += '<text y="34" font-size="10" fill="#fde68a" text-anchor="middle">🗺️</text>';
                } else {
                    html += '<text>' + (d.emoji || "💰") + "</text>";
                }
                html += "</g>";
            }
        }
        return html;
    }

    function getRegionList() {
        const list = [];
        for (const c of world.continents || []) list.push({ ...c, kind: "continent" });
        if (world.ocean) list.push({ ...world.ocean, kind: "ocean" });
        return list;
    }

    function isComingSoon(meta) {
        return !!meta.comingSoon;
    }

    function maxStarsForRegion(data) {
        return (data.nodes?.length || 0) * 3;
    }

    function starsInRegion(continentId) {
        const cs = save.continents[continentId];
        if (!cs) return 0;
        let s = 0;
        for (const nid in cs.nodes) s += cs.nodes[nid].stars || 0;
        return s;
    }

    function canUnlockNode(node, data) {
        const u = node.unlock;
        if (u?.type === "bonus") {
            const need = u.minStars ?? UNLOCK_MIN_STARS;
            const main = data.nodes.filter(n => !n.bonus);
            return main.length > 0 && main.every(n => nodeStars(data.id, n.id) >= need);
        }
        if (!u || u.type === "free") return true;
        if (!u.requires) return true;
        const prevStars = nodeStars(data.id, u.requires);
        return prevStars >= (u.minStars ?? UNLOCK_MIN_STARS);
    }

    function findPrevNode(node, data) {
        const u = node.unlock;
        if (!u || !u.requires) return null;
        return data.nodes.find(n => n.id === u.requires) || null;
    }

    function starsForSession(correct, total, wrong, comboMax) {
        const ratio = correct / total;
        if (ratio < 0.5) return 0;
        if (ratio >= 1) return 3;
        if (ratio >= 0.8 && wrong <= 1) return 2;
        if (ratio >= 0.8 && comboMax >= 3) return 3;
        if (ratio >= 0.8) return 2;
        return 1;
    }

    let currentRegion = null;
    let currentData = null;
    let currentNode = null;
    let session = null;
    let answering = false;

    function regionMaxStars(meta) {
        if (meta.id === "europe") return 21;
        if (meta.id === "ocean") return 12;
        return "—";
    }

    const puzzleImageCache = {};
    const PUZZLE_COLORS = [
        "#3b82f6", "#22c55e", "#eab308", "#f97316", "#a855f7", "#ec4899",
        "#14b8a6", "#64748b", "#0ea5e9", "#84cc16", "#f43f5e", "#8b5cf6",
        "#06b6d4", "#d946ef", "#f59e0b", "#10b981", "#6366f1", "#ef4444", "#2dd4bf",
    ];

    async function buildEuropePuzzleImage(mapId) {
        const key = mapId || "europe-countries";
        if (puzzleImageCache[key]) return puzzleImageCache[key];
        const mapData = await loadMap(key);
        const parts = (mapData.viewBox || "0 0 1000 780").split(/\s+/).map(Number);
        const vw = parts[2] || 1000;
        const vh = parts[3] || 780;
        const cw = 500;
        const ch = 400;
        const canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#1e3a8a";
        ctx.fillRect(0, 0, cw, ch);
        const sx = cw / vw;
        const sy = ch / vh;
        (mapData.countries || []).forEach((c, i) => {
            if (!c.path || c.id === "europe-puzzle") return;
            const p = new Path2D(c.path);
            ctx.save();
            ctx.scale(sx, sy);
            ctx.fillStyle = PUZZLE_COLORS[i % PUZZLE_COLORS.length];
            ctx.fill(p);
            ctx.strokeStyle = "rgba(255,255,255,0.45)";
            ctx.lineWidth = 1.2;
            ctx.stroke(p);
            ctx.restore();
        });
        const url = canvas.toDataURL("image/png");
        puzzleImageCache[key] = url;
        return url;
    }

    function renderOrbitRing() {
        orbitRing.innerHTML = "";
        const regions = getRegionList();
        const n = regions.length;
        const radiusPct = 46;
        regions.forEach((meta, i) => {
            const angleDeg = -90 + (360 / n) * i;
            const angleRad = angleDeg * Math.PI / 180;
            const left = 50 + radiusPct * Math.cos(angleRad);
            const top = 50 + radiusPct * Math.sin(angleRad);
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "orbit-chip" + (isComingSoon(meta) ? " locked" : "");
            chip.dataset.regionId = meta.id;
            chip.style.left = left + "%";
            chip.style.top = top + "%";
            chip.style.transform = "translate(-50%, -50%)";
            const got = starsInRegion(meta.id);
            chip.innerHTML =
                '<span class="em">' + meta.emoji + "</span>" +
                '<span class="nm">' + meta.title + (isComingSoon(meta) ? " 🔒" : "") + "</span>" +
                '<span class="pr">' + got + "/" + regionMaxStars(meta) + "</span>";
            chip.addEventListener("click", () => beginRegionFlight(meta));
