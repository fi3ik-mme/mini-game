        highlightOrbitChip(save.lastPlayed?.continentId);
    }

    function highlightOrbitChip(regionId) {
        orbitRing.querySelectorAll(".orbit-chip").forEach(c => {
            c.classList.toggle("pulse", regionId && c.dataset.regionId === regionId);
            c.classList.toggle("highlight", regionId && c.dataset.regionId === regionId);
        });
    }

    function pickContinentAtLatLon(lat, lon) {
        for (const p of LAND_PICKERS) {
            if (p.test(lat, lon)) return p.id;
        }
        return null;
    }

    /**
     * Геометричні центри регіонів (lat/lon на Землі).
     * Кути камери (lon/tilt) обчислюються окремо, щоб центр екрана = ця точка.
     */
    const REGION_GEO_CENTERS = {
        europe: { lat: 54.5, lon: 17.5 },
        asia: { lat: 43.5, lon: 88.0 },
        africa: { lat: 5.5, lon: 22.5 },
        "north-america": { lat: 47.0, lon: -101.0 },
        "south-america": { lat: -14.5, lon: -56.5 },
        oceania: { lat: -23.5, lon: 140.5 },
        antarctica: { lat: -82.5, lon: 25.0 },
        ocean: { lat: 0.0, lon: -160.0 }
    };
    const TILT_MIN = -68;
    const TILT_MAX = 68;

    const AUTO_ROTATE_DEG_PER_SEC = 5;
    const FLIGHT_ROTATE_MS = 1000;
    const FLIGHT_ZOOM_MS = 1350;
    const FLIGHT_MAX_ZOOM = 5.5;

    const globe = (() => {
        let lon = 20;
        let tilt = 0;
        let zoom = 1;
        let texPixels = null;
        let texW = 0;
        let texH = 0;
        let dragging = false;
        let lastX = 0;
        let lastY = 0;
        let moved = false;
        let ready = false;
        let autoRotate = true;
        let animating = false;
        let loopId = 0;
        let lastFrame = 0;

        function normLon(l) {
            return ((l + 180) % 360) - 180;
        }

        function lerpLon(from, to, t) {
            let diff = ((to - from + 540) % 360) - 180;
            return normLon(from + diff * t);
        }

        function clampTilt(v) {
            return Math.max(TILT_MIN, Math.min(TILT_MAX, v));
        }

        function lerpTilt(from, to, t) {
            return clampTilt(from + (to - from) * t);
        }

        /** Яка точка на Землі в центрі екрана при заданих кутах камери. */
        function centerGeoAtAngles(viewLonDeg, viewTiltDeg) {
            const lonR = viewLonDeg * Math.PI / 180;
            const tiltR = viewTiltDeg * Math.PI / 180;
            const cosY = Math.cos(-lonR);
            const sinY = Math.sin(-lonR);
            const x1 = sinY;
            const z1 = cosY;
            const cosX = Math.cos(-tiltR);
            const sinX = Math.sin(-tiltR);
            const y2 = -z1 * sinX;
            const z2 = z1 * cosX;
            const x2 = x1;
            const lat = Math.asin(Math.max(-1, Math.min(1, y2))) * (180 / Math.PI);
            const ln = Math.atan2(x2, z2) * (180 / Math.PI);
            return { lat, lon: normLon(ln) };
        }

        function geoAngularDist(a, b) {
            const φ1 = a.lat * Math.PI / 180;
            const φ2 = b.lat * Math.PI / 180;
            const Δλ = (b.lon - a.lon) * Math.PI / 180;
            const h = Math.sin((φ2 - φ1) / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return 2 * Math.asin(Math.min(1, Math.sqrt(h)));
        }

        /** Підбирає lon/tilt, щоб (lat0, lon0) опинилась у центрі диска. */
        function anglesToCenterGeo(lat0, lon0) {
            let bestLon = lon0;
            let bestTilt = lat0;
            let bestD = 1e9;
            const target = { lat: lat0, lon: normLon(lon0) };

            function search(lonMin, lonMax, tiltMin, tiltMax, step) {
                for (let t = tiltMin; t <= tiltMax; t += step) {
                    for (let l = lonMin; l <= lonMax; l += step) {
                        const c = centerGeoAtAngles(normLon(l), clampTilt(t));
                        const d = geoAngularDist(c, target);
                        if (d < bestD) {
                            bestD = d;
                            bestLon = l;
                            bestTilt = t;
                        }
                    }
                }
            }

            search(lon0 - 40, lon0 + 40, lat0 - 35, lat0 + 35, 0.5);
            search(bestLon - 3, bestLon + 3, bestTilt - 3, bestTilt + 3, 0.08);
            return { lon: normLon(bestLon), tilt: clampTilt(bestTilt) };
        }

        /** Камера: R_y(lon) · R_x(tilt). Зворотне перетворення променя виду → lat/lon. */
        function viewToLatLon(nx, ny, nz) {
            const lonR = lon * Math.PI / 180;
            const tiltR = tilt * Math.PI / 180;
            const cosY = Math.cos(-lonR);
            const sinY = Math.sin(-lonR);
            const x1 = nx * cosY + nz * sinY;
            const z1 = -nx * sinY + nz * cosY;
            const y1 = ny;
            const cosX = Math.cos(-tiltR);
            const sinX = Math.sin(-tiltR);
            const x2 = x1;
            const y2 = y1 * cosX - z1 * sinX;
            const z2 = y1 * sinX + z1 * cosX;
            const lat = Math.asin(Math.max(-1, Math.min(1, y2))) * (180 / Math.PI);
            const ln = Math.atan2(x2, z2) * (180 / Math.PI);
            return { lat, lon: normLon(ln) };
        }

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        function applyTransform() {
            globeWrap.style.transform = "translate(-50%, -50%) scale(" + zoom.toFixed(3) + ")";
        }

        function sampleTexture(u, v) {
            const x = Math.min(texW - 1, Math.max(0, Math.floor(u * texW)));
            const y = Math.min(texH - 1, Math.max(0, Math.floor(v * texH)));
            const i = (y * texW + x) * 4;
            return [texPixels[i], texPixels[i + 1], texPixels[i + 2]];
        }

        function canvasPixelToLatLon(px, py, size) {
            const cx = size / 2;
            const cy = size / 2;
            const R = size / 2 * 0.96;
            const nx = (px - cx) / R;
            const ny = -(py - cy) / R;
            if (nx * nx + ny * ny > 1) return null;
            const nz = Math.sqrt(1 - nx * nx - ny * ny);
            return viewToLatLon(nx, ny, nz);
        }

        function draw() {
            if (!ready || !texPixels) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const display = Math.min(globeCanvas.clientWidth, globeCanvas.clientHeight) || 220;
            const size = Math.max(64, Math.floor(display * dpr));
            if (globeCanvas.width !== size || globeCanvas.height !== size) {
                globeCanvas.width = size;
                globeCanvas.height = size;
            }
            const ctx = globeCanvas.getContext("2d", { willReadFrequently: true });
            const img = ctx.createImageData(size, size);
            const data = img.data;
            const cx = size / 2;
            const cy = size / 2;
            const R = size / 2 * 0.96;

            for (let py = 0; py < size; py++) {
                for (let px = 0; px < size; px++) {
                    const i = (py * size + px) * 4;
                    const nx = (px - cx) / R;
                    const ny = -(py - cy) / R;
                    const d2 = nx * nx + ny * ny;
                    if (d2 > 1) {
                        data[i + 3] = 0;
                        continue;
                    }
                    const nz = Math.sqrt(1 - d2);
                    const { lat, lon: ln } = viewToLatLon(nx, ny, nz);
                    let u = (ln + 180) / 360;
                    const v = (90 - lat) / 180;
                    const rgb = sampleTexture(u, v);
                    const light = 0.45 + 0.55 * Math.max(0, nz * 0.85 + nx * 0.15);
                    data[i] = Math.min(255, rgb[0] * light);
                    data[i + 1] = Math.min(255, rgb[1] * light);
                    data[i + 2] = Math.min(255, rgb[2] * light);
                    data[i + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            ctx.globalCompositeOperation = "destination-over";
            const atmo = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 1.02);
            atmo.addColorStop(0, "rgba(30, 100, 180, 0)");
            atmo.addColorStop(1, "rgba(10, 40, 90, 0.35)");
            ctx.fillStyle = atmo;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = "source-over";
        }

        function tick(now) {
            if (!lastFrame) lastFrame = now;
            const dt = Math.min(48, now - lastFrame);
            lastFrame = now;
            if (ready && autoRotate && !dragging && !animating) {
                lon = normLon(lon + (AUTO_ROTATE_DEG_PER_SEC * dt) / 1000);
                draw();
            }
            loopId = requestAnimationFrame(tick);
        }

        function loadTexture() {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement("canvas");
                    c.width = img.naturalWidth;
                    c.height = img.naturalHeight;
                    c.getContext("2d").drawImage(img, 0, 0);
                    const id = c.getContext("2d").getImageData(0, 0, c.width, c.height);
                    texPixels = id.data;
                    texW = c.width;
                    texH = c.height;
                    ready = true;
                    applyTransform();
                    draw();
                    if (!loopId) loopId = requestAnimationFrame(tick);
                    resolve();
                };
                img.onerror = () => reject(new Error("earth texture"));
                img.src = url("assets/earth-equirect.jpg");
            });
        }

        function onPointerDown(e) {
            if (animating) return;
            dragging = true;
            moved = false;
            lastX = e.clientX;
            lastY = e.clientY;
            globeCanvas.classList.add("dragging");
            globeCanvas.setPointerCapture(e.pointerId);
        }

        function onPointerMove(e) {
            if (!dragging || animating) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
            lastX = e.clientX;
            lastY = e.clientY;
            lon = normLon(lon + dx * 0.35);
            tilt = clampTilt(tilt - dy * 0.22);
            draw();
        }

        function onPointerUp(e) {
            if (!dragging) return;
            dragging = false;
            globeCanvas.classList.remove("dragging");
            try { globeCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
            if (animating) return;
            if (!moved) {
                const rect = globeCanvas.getBoundingClientRect();
                const scale = globeCanvas.width / rect.width;
                const px = (e.clientX - rect.left) * scale;
                const py = (e.clientY - rect.top) * scale;
                const hit = canvasPixelToLatLon(px, py, globeCanvas.width);
                if (hit) {
                    const cid = pickContinentAtLatLon(hit.lat, hit.lon);
                    if (cid) {
                        const meta = getRegionList().find(r => r.id === cid);
                        if (meta) beginRegionFlight(meta);
                    } else {
                        toast("Це океан — обери материк або плитку 🌊");
                        audio.tap();
                    }
                }
            }
        }

        function flyTo(meta) {
            const geo = REGION_GEO_CENTERS[meta.id] || { lat: 0, lon: 0 };
            const aimed = anglesToCenterGeo(geo.lat, geo.lon);
            const targetLon = aimed.lon;
            const targetTilt = aimed.tilt;
            const startLon = lon;
            const startTilt = tilt;
            const startZoom = zoom;
            animating = true;
            autoRotate = false;
            hubScene.classList.add("flight");
            hubScreen.classList.add("flight-active");

            return new Promise(resolve => {
                const t0 = performance.now();
                const total = FLIGHT_ROTATE_MS + FLIGHT_ZOOM_MS;

                function frame(now) {
                    const elapsed = now - t0;
                    if (elapsed < FLIGHT_ROTATE_MS) {
                        const t = easeInOut(elapsed / FLIGHT_ROTATE_MS);
                        lon = lerpLon(startLon, targetLon, t);
                        tilt = lerpTilt(startTilt, targetTilt, t);
                        zoom = startZoom;
                    } else if (elapsed < total) {
                        lon = targetLon;
                        tilt = targetTilt;
                        const t = easeInOut((elapsed - FLIGHT_ROTATE_MS) / FLIGHT_ZOOM_MS);
                        zoom = startZoom + (FLIGHT_MAX_ZOOM - startZoom) * t;
                    } else {
                        lon = targetLon;
                        tilt = targetTilt;
                        zoom = FLIGHT_MAX_ZOOM;
                        applyTransform();
                        draw();
                        resolve();
                        return;
                    }
                    applyTransform();
                    draw();
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            });
        }

        function resetView() {
            animating = false;
            autoRotate = true;
            zoom = 1;
            tilt = 0;
            applyTransform();
            hubScene.classList.remove("flight");
            hubScreen.classList.remove("flight-active");
            draw();
        }

        globeCanvas.addEventListener("pointerdown", onPointerDown);
        globeCanvas.addEventListener("pointermove", onPointerMove);
        globeCanvas.addEventListener("pointerup", onPointerUp);
        globeCanvas.addEventListener("pointercancel", onPointerUp);
        window.addEventListener("resize", () => { if (ready) draw(); });

        return {
            loadTexture,
            flyTo,
            resetView,
            setView(lonDeg, tiltDeg) {
                lon = normLon(lonDeg);
                tilt = clampTilt(tiltDeg || 0);
                draw();
            },
            setGeoCenter(latDeg, lonDeg) {
                const a = anglesToCenterGeo(latDeg, lonDeg);
                lon = a.lon;
                tilt = a.tilt;
                draw();
            },
            isAnimating: () => animating
        };
    })();

    let flightBusy = false;

    async function beginRegionFlight(meta) {
        if (flightBusy || globe.isAnimating()) return;
        if (isComingSoon(meta)) {
            toast("Скоро відкриється!");
            audio.tap();
            return;
        }
        if (!hubScreen.classList.contains("active")) {
            await openRegionAfterFlight(meta);
            return;
        }
        flightBusy = true;
        const resumeBtn = document.getElementById("btn-resume");
        resumeBtn.disabled = true;
        try {
            const dataPromise = loadContinentData(meta);
            await globe.flyTo(meta);
            await dataPromise;
            await openRegionAfterFlight(meta);
        } finally {
            flightBusy = false;
            resumeBtn.disabled = false;
        }
    }

    async function openRegionAfterFlight(meta) {
        audio.select();
        currentRegion = meta;
        currentData = continentCache[meta.id] || await loadContinentData(meta);
        save.lastPlayed = { continentId: meta.id, nodeId: save.lastPlayed?.nodeId };
        saveSave();
        highlightOrbitChip(meta.id);
        await renderMap();
        showScreen(mapScreen);
        globe.resetView();
    }

    function nodeStatusClass(node, data) {
        if (!canUnlockNode(node, data)) return "locked";
        const stars = nodeStars(data.id, node.id);
        if (stars >= 3) return "done-3";
        if (stars >= 2) return "done-2";
        if (stars >= 1) return "done-1";
        if (!node.bonus) {
            const firstOpen = data.nodes.find(n =>
                !n.bonus && canUnlockNode(n, data) && nodeStars(data.id, n.id) < 3);
            if (firstOpen && firstOpen.id === node.id) return "current";
        } else if (stars === 0) {
            return "current";
        }
        return "available";
    }

    async function renderMap() {
        if (!currentData) return;
        mapTitle.textContent = currentData.title;
        const geo = await loadContinentGeo(currentData);
        const vb = (geo && geo.viewBox) || currentData.map?.viewBox || "0 0 1000 780";
        mapSvg.setAttribute("viewBox", vb);
        const parts = vb.split(/\s+/).map(Number);
        const w = parts[2] || 1000;
        const h = parts[3] || 780;

        let html = "";
        const isOceanAdventure = geo && geo.theme === "adventure";
        if (isOceanAdventure) {
            html += renderOceanMapLayers(geo, w, h);
        } else {
            html += '<rect width="' + w + '" height="' + h + '" fill="' +
                (geo && geo.background ? geo.background : "#1e3a8a") + '"/>';
        }

        const features = geo ? (geo.countries || geo.regions || []) : [];
        const playableIds = new Set(currentData.nodes.map(n => nodeGeoId(n)));
        const starsByNode = {};
        for (const node of currentData.nodes) {
            starsByNode[nodeGeoId(node)] = nodeStars(currentData.id, node.id);
        }

        for (const f of features) {
            const isPlayable = playableIds.has(f.id);
            const stars = starsByNode[f.id] || 0;
            let extra = "";
            if (isPlayable && stars > 0) extra = " done";
            html += '<path class="map-geo' + (isPlayable ? " playable" + extra : " context") +
                '" data-geo-id="' + f.id + '" d="' + f.path + '"/>';
        }

        if (isOceanAdventure) {
            html += renderOceanDecorations(geo);
        }

        const positions = currentData.nodes.filter(n => !n.bonus).map(node => {
            const c = getNodeCenter(geo, node);
            return { node, x: c ? c.x : w / 2, y: c ? c.y : h / 2 };
        });
        const bonusPositions = currentData.nodes.filter(n => n.bonus).map(node => {
            const c = getNodeCenter(geo, node);
            return { node, x: c ? c.x : w / 2, y: c ? c.y : h / 2 };
        });

        if (positions.length > 1) {
            const trailD = buildFlexibleTrail(positions);
            if (trailD) {
                html += '<path class="trail" d="' + trailD + '"/>';
            }
        }

        const largeNodes = isOceanAdventure;
        for (const p of positions) {
            const cls = nodeStatusClass(p.node, currentData);
            const stars = nodeStars(currentData.id, p.node.id);
            html += renderMapNode(p, cls, stars, largeNodes);
        }
        for (const p of bonusPositions) {
            const cls = nodeStatusClass(p.node, currentData);
            const stars = nodeStars(currentData.id, p.node.id);
            html += renderMapNode(p, cls, stars, largeNodes);
        }
        mapSvg.innerHTML = html;
        const mapScroll = document.getElementById("map-scroll");
        mapScroll.classList.toggle("ocean-adventure", !!isOceanAdventure);

        mapSvg.querySelectorAll(".map-node").forEach(g => {
            const onTap = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const id = g.getAttribute("data-id");
                const node = currentData.nodes.find(n => n.id === id);
                if (!node) return;
                if (!canUnlockNode(node, currentData)) {
                    const prev = findPrevNode(node, currentData);
                    const lockedEl = document.getElementById("locked-msg");
                    if (node.bonus) {
                        lockedEl.textContent =
                            "Бонус відкриється, коли на кожній країні Європи буде щонайменше " +
                            UNLOCK_MIN_STARS + " ⭐.";
                    } else {
                        lockedEl.textContent = prev
                            ? "Спочатку набери щонайменше " + UNLOCK_MIN_STARS + " ⭐ на «" + prev.title + "»."
                            : "Ця точка ще закрита.";
                    }
                    document.getElementById("modal-locked").classList.add("active");
                    audio.wrong();
                    return;
                }
                startNode(node);
            };
            g.addEventListener("click", onTap);
        });

        const current = currentData.nodes.find(n => nodeStatusClass(n, currentData) === "current");
        if (current) {
            const c = getNodeCenter(geo, current);
            if (c) {
                document.getElementById("map-scroll").scrollTop = Math.max(0, c.y - 120);
            }
        }
    }

    function startNode(node) {
        audio.select();
        currentNode = node;
        session = {
            correct: 0, wrong: 0, combo: 0, comboMax: 0, coinsEarned: 0, roundIndex: 0,
            puzzleMoves: 0, puzzleHint: false,
        };
        save.lastPlayed = { continentId: currentData.id, nodeId: node.id };
        saveSave();
        showScreen(gameScreen);
        renderRound();
    }

    function renderRoundDots() {
        roundDots.innerHTML = "";
        const total = currentNode.rounds.length;
        for (let i = 0; i < total; i++) {
            const d = document.createElement("span");
            d.className = "dot";
            if (i < session.roundIndex) d.classList.add("done");
            if (i === session.roundIndex) d.classList.add("current");
            roundDots.appendChild(d);
        }
        const round = currentNode.rounds[session.roundIndex];
        if (round && round.type === "puzzle") {
            gameLocation.textContent = currentNode.title + " · бонус";
        } else {
            gameLocation.textContent = currentNode.title + " · " + (session.roundIndex + 1) + "/" + total;
        }
    }

    const mapCacheLoaded = {};

    function buildExplanationMedia(media) {
        const wrap = document.createElement("div");
        wrap.className = "explanation-media";
        if (media.image) {
            const link = document.createElement("a");
            link.href = media.wikiUrl || "#";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "explanation-media-link";
            link.title = "Відкрити у Вікіпедії";
            const img = document.createElement("img");
            img.src = media.image;
            img.alt = media.caption || "";
            img.loading = "lazy";
            img.onerror = function () {
                link.remove();
            };
            link.appendChild(img);
            wrap.appendChild(link);
        }
        if (media.caption) {
            const cap = document.createElement("p");
            cap.className = "explanation-media-caption";
            if (media.wikiUrl) {
                const a = document.createElement("a");
                a.href = media.wikiUrl;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = media.caption + " · Вікіпедія →";
                cap.appendChild(a);
            } else {
                cap.textContent = media.caption;
            }
            wrap.appendChild(cap);
        }
        return wrap;
    }

    function showFeedbackModal(round, ok) {
        document.getElementById("feedback-title").textContent = ok ? "✓ Правильно!" : "Ось пояснення";
        const textEl = document.getElementById("feedback-text");
        textEl.innerHTML = "";
        if (round.explanation) {
            const p = document.createElement("p");
            p.className = "feedback-explanation";
            p.textContent = round.explanation;
            textEl.appendChild(p);
        }
        if (round.explanationMedia && round.explanationMedia.image) {
            textEl.appendChild(buildExplanationMedia(round.explanationMedia));
        } else if (round.explanationMedia && round.explanationMedia.wikiUrl) {
            textEl.appendChild(buildExplanationMedia(round.explanationMedia));
        } else if (round.wikiUrl) {
            const p = document.createElement("p");
            p.className = "explanation-media-caption";
            const a = document.createElement("a");
            a.href = round.wikiUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "Дізнатися більше · Вікіпедія →";
            p.appendChild(a);
            textEl.appendChild(p);
        }
        document.getElementById("modal-feedback").classList.add("active");
    }

    const renderers = {
        quiz(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = round.media || "";
            gameAnswers.className = "answers grid";
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
            choices.forEach((opt) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "answer-btn";
                btn.textContent = opt.text;
                btn.addEventListener("click", () => submitAnswer(opt.isCorrect, round, btn));
                gameAnswers.appendChild(btn);
            });
        },
        yesno(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = round.media || "";
            gameAnswers.className = "answers yesno";
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
            choices.forEach((opt) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "answer-btn";
                btn.textContent = opt.label;
                btn.addEventListener("click", () => submitAnswer(opt.value === round.correct, round, btn));
                gameAnswers.appendChild(btn);
            });
        },
        capital(ctx, round) {
            renderers.quiz(ctx, round);
        },
        imageQuiz(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = round.media || "";
            const fitContain = round.imageFit === "contain";
            gameAnswers.className = "answers image-grid" +
                (fitContain ? " fit-contain" : "");
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
            choices.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "answer-img-btn no-labels";
                const img = document.createElement("img");
                img.src = opt.image;
                img.alt = "Варіант " + (i + 1);
                img.loading = "lazy";
                img.onerror = function () {
                    btn.disabled = true;
                    btn.classList.add("img-missing");
                    img.style.display = "none";
                };
                btn.appendChild(img);
                btn.addEventListener("click", () => submitAnswer(opt.isCorrect, round, btn));
                gameAnswers.appendChild(btn);
            });
        },
        async puzzle(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = "";
            gameAnswers.className = "answers puzzle-wrap";
            gameAnswers.innerHTML = "<p style='color:#94a3b8;text-align:center'>Завантаження пазла…</p>";
            mentorBubble.textContent = "🧭 Обери першу плитку, потім другу — вони поміняються місцями.";

            const cols = round.cols || 5;
            const rows = round.rows || 4;
            const total = cols * rows;
            let imageUrl;
            try {
                imageUrl = await buildEuropePuzzleImage(round.mapId || "europe-countries");
            } catch (e) {
                console.error(e);
                gameAnswers.innerHTML = "<p>Не вдалося завантажити пазл.</p>";
                return;
            }

            gameAnswers.innerHTML = "";
            const toolbar = document.createElement("div");
            toolbar.className = "puzzle-toolbar";
            const stat = document.createElement("span");
            stat.className = "puzzle-stat";
            stat.textContent = "Ходи: 0";
            const preview = document.createElement("img");
            preview.className = "puzzle-preview";
            preview.src = imageUrl;
            preview.alt = "Підказка: як має виглядати карта";
            preview.hidden = true;
            const hintBtn = document.createElement("button");
            hintBtn.type = "button";
            hintBtn.className = "btn-mini";
            hintBtn.textContent = "Підказка";
            const shuffleBtn = document.createElement("button");
            shuffleBtn.type = "button";
            shuffleBtn.className = "btn-mini";
            shuffleBtn.textContent = "Перемішати";
            toolbar.appendChild(stat);
            toolbar.appendChild(hintBtn);
            toolbar.appendChild(shuffleBtn);

            const board = document.createElement("div");
            board.className = "puzzle-board";
            board.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
            board.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";

            let order = [];
            for (let i = 0; i < total; i++) order.push(i);
            let selected = null;
            session.puzzleMoves = 0;
            session.puzzleHint = false;

            function shuffleOrder() {
                do {
                    order = shuffleArray(order);
                } while (order.every((v, i) => v === i));
                selected = null;
            }
            shuffleOrder();

            function pieceBgPos(pieceIdx) {
                const col = pieceIdx % cols;
                const row = Math.floor(pieceIdx / cols);
                const x = cols > 1 ? (col / (cols - 1)) * 100 : 0;
                const y = rows > 1 ? (row / (rows - 1)) * 100 : 0;
                return x + "% " + y + "%";
            }

            function isSolved() {
                return order.every((v, i) => v === i);
            }

            function onSolved() {
                if (answering) return;
                answering = true;
                session.correct = 1;
                session.wrong = session.puzzleHint || session.puzzleMoves > 55 ? 1 : 0;
                session.combo = 1;
                session.comboMax = 1;
                audio.correct();
                flash("correct");
                confetti(30);
                mentorBubble.textContent = "🧭 Карта Європи зібрана! Чудова робота!";
                setTimeout(() => {
                    if (round.explainOnSuccess || round.explanation) {
                        showFeedbackModal(round, true);
                    } else {
                        finishNode();
                    }
                }, 600);
            }

            function renderBoard() {
                board.innerHTML = "";
                order.forEach((pieceIdx, slotIdx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "puzzle-piece";
                    if (slotIdx === selected) btn.classList.add("selected");
                    if (pieceIdx === slotIdx) btn.classList.add("correct-slot");
                    btn.style.backgroundImage = "url(" + imageUrl + ")";
                    btn.style.backgroundSize = cols * 100 + "% " + rows * 100 + "%";
                    btn.style.backgroundPosition = pieceBgPos(pieceIdx);
                    btn.setAttribute("aria-label", "Плитка " + (slotIdx + 1));
                    btn.addEventListener("click", () => {
                        if (answering) return;
                        if (selected === null) {
                            selected = slotIdx;
                            audio.tap();
                            renderBoard();
                            return;
                        }
                        if (selected === slotIdx) {
                            selected = null;
                            renderBoard();
                            return;
                        }
                        const a = selected;
                        const b = slotIdx;
                        const tmp = order[a];
                        order[a] = order[b];
                        order[b] = tmp;
                        selected = null;
                        session.puzzleMoves++;
                        stat.textContent = "Ходи: " + session.puzzleMoves;
                        audio.tap();
                        renderBoard();
                        if (isSolved()) onSolved();
                    });
                    board.appendChild(btn);
                });
            }

            hintBtn.addEventListener("click", () => {
                audio.tap();
                session.puzzleHint = true;
                preview.hidden = !preview.hidden;
                hintBtn.textContent = preview.hidden ? "Підказка" : "Сховати";
            });
            shuffleBtn.addEventListener("click", () => {
                if (answering) return;
                audio.tap();
                shuffleOrder();
                session.puzzleMoves++;
                stat.textContent = "Ходи: " + session.puzzleMoves;
                renderBoard();
            });

            gameAnswers.appendChild(toolbar);
            gameAnswers.appendChild(preview);
            gameAnswers.appendChild(board);
            renderBoard();
        },
        async mapTap(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = "";
            gameAnswers.className = "answers";
            gameAnswers.innerHTML = "<p style='text-align:center;color:#94a3b8'>Натисни країну на карті</p>";
            const mapData = await loadMap(round.mapId || "europe-simple");
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", mapData.viewBox || "0 0 400 360");
            svg.setAttribute("class", "map-tap-svg");
            for (const c of mapData.countries) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", c.path);
                path.setAttribute("data-id", c.id);
                if (c.id === round.targetCountryId) path.classList.add("highlight");
                path.addEventListener("click", () => {
                    if (answering) return;
                    const ok = c.id === round.targetCountryId;
                    if (!ok) path.setAttribute("fill", "rgba(239,68,68,0.5)");
                    submitAnswer(ok, round, path);
                });
                svg.appendChild(path);
            }
            gameMedia.innerHTML = "";
            gameMedia.appendChild(svg);
        }
    };

    function renderRound() {
        answering = false;
        const round = currentNode.rounds[session.roundIndex];
        session.currentChoices = prepareRoundChoices(round);
        renderRoundDots();
        mentorBubble.textContent = "🧭 " + randomPick(PRAISE);
        voice.speak(round.text);
        const fn = renderers[round.type];
        if (!fn) {
            gamePrompt.textContent = "Невідомий тип: " + round.type;
            return;
        }
        Promise.resolve(fn(null, round)).catch(console.error);
    }

    function awardCoins(amount, round) {
        let add = amount;
        if (session.combo >= 3) {
            add *= 2;
            showComboBanner("Комбо x2! +" + add + " 🪙");
        }
        if (round.boss) add *= 2;
        session.coinsEarned += add;
        save.coins += add;
        audio.coin();
        updateHud("coins");
    }

    function submitAnswer(ok, round, el) {
        if (answering) return;
        answering = true;
        [...gameAnswers.querySelectorAll(".answer-btn, .answer-img-btn")].forEach(b => {
            b.disabled = true;
        });

        if (ok) {
            if (el && el.classList) el.classList.add("correct");
            session.correct++;
            session.combo++;
            session.comboMax = Math.max(session.comboMax, session.combo);
            awardCoins(1, round);
            audio.correct();
            flash("correct");
            mentorBubble.textContent = "🧭 " + randomPick(PRAISE);
            if (round.explainOnSuccess || round.explanationMedia) {
                showFeedbackModal(round, true);
            } else {
                setTimeout(advanceRound, 600);
            }
        } else {
            if (el && el.classList) el.classList.add("wrong");
            session.wrong++;
            session.combo = 0;
            audio.wrong();
            flash("wrong");
            shake();
            mentorBubble.textContent = "🧭 " + randomPick(ENCOURAGE);
            showFeedbackModal(round, false);
        }
    }

    function advanceRound() {
        document.getElementById("modal-feedback").classList.remove("active");
        session.roundIndex++;
        if (session.roundIndex >= currentNode.rounds.length) {
            finishNode();
        } else {
            renderRound();
        }
    }

    document.getElementById("feedback-next").addEventListener("click", () => {
        audio.tap();
        const round = currentNode && currentNode.rounds[session.roundIndex];
        if (round && round.type === "puzzle" && answering) {
            document.getElementById("modal-feedback").classList.remove("active");
            finishNode();
            return;
        }
        advanceRound();
    });

    function finishNode() {
        const total = currentNode.rounds.length;
        const stars = starsForSession(session.correct, total, session.wrong, session.comboMax);
        const cs = continentSave(currentData.id);
        const prev = cs.nodes[currentNode.id]?.stars || 0;
        if (stars > prev) cs.nodes[currentNode.id] = { stars, bestCombo: session.comboMax };
        else if (cs.nodes[currentNode.id]) {
            cs.nodes[currentNode.id].bestCombo = Math.max(cs.nodes[currentNode.id].bestCombo || 0, session.comboMax);
        } else {
            cs.nodes[currentNode.id] = { stars, bestCombo: session.comboMax };
        }
        if (stars === 3) {
            save.coins += 3;
            session.coinsEarned += 3;
        }
        save.comboBest = Math.max(save.comboBest, session.comboMax);
        recalcTotalStars();
        saveSave();
        updateHud("stars");

        const titles = ["Спробуй ще!", "Непогано!", "Молодець!", "Ідеально!"];
        document.getElementById("result-title").textContent = titles[stars] || "Готово";
        document.getElementById("result-stars").textContent = stars > 0 ? "⭐".repeat(stars) : "—";
        document.getElementById("result-coins").textContent = "+" + session.coinsEarned + " монет";
        document.getElementById("modal-result").classList.add("active");
        if (stars >= 2) {
            audio.win();
            confetti(stars === 3 ? 40 : 20);
            flash("win");
        } else {
            audio.star();
        }

        if (stars >= 3 && currentData.id === "europe" &&
            currentData.nodes.filter(n => !n.bonus).every(n => nodeStars("europe", n.id) >= 3)) {
            if (!save.badges.includes("europe-complete")) {
                save.badges.push("europe-complete");
                saveSave();
                setTimeout(() => toast("Бейдж: Європа завершена! 🏅"), 800);
            }
        }
    }

    document.getElementById("result-next").addEventListener("click", () => {
        audio.tap();
        document.getElementById("modal-result").classList.remove("active");
        renderMap().then(() => {
            renderOrbitRing();
            showScreen(mapScreen);
        });
    });

    document.querySelectorAll("[data-close]").forEach(btn => {
        btn.addEventListener("click", () => {
            audio.tap();
            btn.closest(".modal-backdrop").classList.remove("active");
        });
    });

    document.getElementById("map-back").addEventListener("click", () => {
        audio.tap();
        globe.resetView();
        renderOrbitRing();
        showScreen(hubScreen);
    });

    function resumeProgress() {
        const lp = save.lastPlayed;
        if (lp?.continentId) {
            const meta = getRegionList().find(r => r.id === lp.continentId);
            if (meta && !isComingSoon(meta)) {
                beginRegionFlight(meta).then(() => {
                    if (lp.nodeId && currentData) {
                        const node = currentData.nodes.find(n => n.id === lp.nodeId);
                        if (node && canUnlockNode(node, currentData)) startNode(node);
                    }
                });
                return;
            }
        }
        const europe = getRegionList().find(r => r.id === "europe");
        if (europe) beginRegionFlight(europe);
    }

    document.getElementById("btn-resume").addEventListener("click", () => {
        audio.tap();
        resumeProgress();
    });

    async function init() {
        updateHud();
        try {
            await loadWorld();
            document.getElementById("hub-tagline").textContent = world.tagline || "";
            await Promise.all([
                loadContinentData(world.continents.find(c => c.id === "europe")),
                loadContinentData(world.ocean),
                globe.loadTexture()
            ]);
            renderOrbitRing();
            if (save.lastPlayed?.continentId && REGION_GEO_CENTERS[save.lastPlayed.continentId]) {
                const c = REGION_GEO_CENTERS[save.lastPlayed.continentId];
                globe.setGeoCenter(c.lat, c.lon);
            }
        } catch (err) {
            console.error(err);
            toast("Не вдалося завантажити дані");
        }
    }

    init();

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("../../sw.js").catch(() => {});
        });
    }
})();
</script>
</body>
</html>
