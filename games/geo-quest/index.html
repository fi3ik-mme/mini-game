<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <title>Гео Квест</title>
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overscroll-behavior: none; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(ellipse at top, #0c4a6e 0%, #0f172a 65%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 12px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        body.shake { animation: shake 0.45s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .top-bar {
            width: 100%;
            max-width: 720px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }
        .back-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:active { background: rgba(255,255,255,0.14); }
        .top-controls { display: flex; gap: 6px; }
        .icon-btn {
            background: rgba(255,255,255,0.06);
            color: #f8fafc;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 1.1rem;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
        }
        .icon-btn:active { transform: scale(0.94); }

        .hud {
            width: 100%;
            max-width: 720px;
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .hud-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .hud-chip.pop { animation: pop 0.45s ease; }
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .hud-chip.stars { color: #fde047; border-color: rgba(253,224,71,0.4); }
        .hud-chip.coins { color: #fbbf24; border-color: rgba(251,191,36,0.4); }

        .screen {
            display: none;
            width: 100%;
            max-width: 720px;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            animation: screen-in 0.35s ease;
        }
        .screen.active { display: flex; }
        @keyframes screen-in {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #screen-hub .title {
            margin: 0 0 20px;
            position: relative;
            z-index: 5;
        }
        h1.title {
            font-size: 1.75rem;
            text-align: center;
            background: linear-gradient(180deg, #fde68a, #fbbf24 60%, #d97706);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hub-scene {
            position: relative;
            width: min(96vw, 440px);
            aspect-ratio: 1;
            margin: 12px auto 10px;
            flex-shrink: 0;
            overflow: visible;
        }
        .hub-scene.flight { overflow: hidden; }
        .globe-wrap {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 88%;
            height: 88%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            z-index: 1;
            will-change: transform;
            pointer-events: auto;
        }
        .globe-canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            cursor: grab;
            touch-action: none;
            opacity: 0.92;
            box-shadow:
                0 0 48px rgba(56, 189, 248, 0.3),
                0 12px 28px rgba(0, 0, 0, 0.4);
        }
        .globe-canvas.dragging { cursor: grabbing; }
        .flight-vignette {
            position: absolute;
            inset: -8%;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 6;
            background: radial-gradient(circle at 50% 48%, transparent 18%, rgba(0, 8, 24, 0.55) 72%, rgba(0, 0, 0, 0.88) 100%);
            transition: opacity 0.35s ease;
        }
        .hub-scene.flight .flight-vignette { opacity: 1; }
        .hub-scene.flight .orbit-ring {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .hub-scene.flight .globe-canvas {
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.45),
                0 20px 50px rgba(0, 0, 0, 0.55);
        }
        #screen-hub.flight-active .hub-actions,
        #screen-hub.flight-active .hub-footer {
            opacity: 0.25;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        .globe-canvas:focus-visible {
            outline: 2px solid #fbbf24;
            outline-offset: 4px;
        }
        .hub-scene::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 90%;
            height: 90%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.1), transparent 55%);
            pointer-events: none;
            z-index: 2;
        }
        .orbit-ring {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }
        .orbit-chip {
            position: absolute;
            pointer-events: auto;
            width: 82px;
            min-height: 68px;
            padding: 7px 5px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.22);
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            color: #f8fafc;
            cursor: pointer;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        }
        .orbit-chip:active { transform: translate(-50%, -50%) scale(0.94); }
        .orbit-chip .em { display: block; font-size: 1.3rem; line-height: 1; flex-shrink: 0; }
        .orbit-chip .nm {
            display: -webkit-box;
            width: 100%;
            font-size: 0.58rem;
            line-height: 1.15;
            color: #cbd5e1;
            margin-top: 2px;
            overflow: hidden;
            white-space: normal;
            word-break: break-word;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .orbit-chip .pr { display: block; font-size: 0.62rem; color: #fde047; margin-top: 1px; flex-shrink: 0; }
        .orbit-chip.locked { opacity: 0.55; }
        .orbit-chip.highlight {
            border-color: #fbbf24;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.45);
        }
        .orbit-chip.pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251,191,36,0.45); }
            50% { box-shadow: 0 0 0 8px rgba(251,191,36,0); }
        }
        @media (min-width: 400px) {
            .orbit-chip { width: 90px; min-height: 72px; }
            .orbit-chip .nm { font-size: 0.6rem; }
        }

        .hub-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }
        .btn {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            color: white;
            width: 100%;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: linear-gradient(180deg, #22c55e, #15803d); }
        .btn-secondary { background: linear-gradient(180deg, #3b82f6, #1d4ed8); }

        .hub-footer {
            width: 100%;
            max-width: 720px;
            display: flex;
            justify-content: space-around;
            font-size: 0.8rem;
            color: #94a3b8;
            padding-top: 4px;
        }

        .map-header {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .map-header h2 { margin: 0; font-size: 1.25rem; flex: 1; text-align: center; }
        .map-stage {
            position: relative;
            width: 100%;
            max-width: 720px;
        }
        .map-bonus-actions {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 8;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .map-bonus-btn {
            border: 2px solid rgba(251,191,36,0.6);
            border-radius: 12px;
            background: rgba(15,23,42,0.88);
            color: #fde68a;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 10px;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0,0,0,0.35);
        }
        .map-bonus-btn:active { transform: scale(0.97); }
        .map-bonus-btn.locked {
            color: #cbd5e1;
            border-color: rgba(148, 163, 184, 0.6);
        }
        .map-bonus-btn:disabled { opacity: 0.88; }

        .map-scroll {
            width: 100%;
            max-height: min(72vh, 640px);
            overflow-y: auto;
            border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.12);
            background: #0c4a6e;
        }
        .map-scroll.ocean-adventure {
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: inset 0 0 50px rgba(6, 42, 71, 0.5);
            background: #0b3d5c;
        }
        .ocean-layer {
            stroke-linejoin: round;
            stroke-linecap: round;
        }
        .ocean-trail-path {
            fill: none;
            stroke: rgba(253, 224, 71, 0.35);
            stroke-width: 4;
            stroke-dasharray: 10 8;
        }
        .ocean-trail-star {
            font-size: 14px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .ocean-trail-star.pending { fill: rgba(255,255,255,0.35); }
        .ocean-trail-star.done { fill: #fde047; }
        .map-svg { width: 100%; height: auto; display: block; }
        .map-geo {
            stroke: rgba(255, 255, 255, 0.45);
            stroke-width: 1.2;
            stroke-linejoin: round;
            transition: fill 0.2s;
        }
        .map-geo.context {
            fill: rgba(71, 85, 105, 0.45);
        }
        .map-geo.playable {
            fill: rgba(56, 189, 248, 0.42);
            stroke: rgba(186, 230, 253, 0.75);
            stroke-width: 1.5;
        }
        .map-geo.playable.done {
            fill: rgba(34, 197, 94, 0.48);
        }
        .map-island {
            fill: #fde68a;
            stroke: #b45309;
            stroke-width: 0.9;
            stroke-linejoin: round;
        }
        .map-island.tiny {
            fill: #fef3c7;
            stroke-width: 0.6;
        }
        .map-bermuda {
            fill: rgba(168, 85, 247, 0.22);
            stroke: #e879f9;
            stroke-width: 2;
            stroke-dasharray: 8 5;
            animation: bermudaPulse 2.5s ease-in-out infinite;
        }
        @keyframes bermudaPulse {
            0%, 100% { fill: rgba(168, 85, 247, 0.18); }
            50% { fill: rgba(168, 85, 247, 0.32); }
        }
        .map-bermuda-label {
            fill: #f5d0fe;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-treasure text {
            font-size: 20px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .map-treasure .treasure-glow {
            fill: rgba(251, 191, 36, 0.35);
            stroke: #fbbf24;
            stroke-width: 1.5;
            animation: treasureGlow 1.8s ease-in-out infinite;
        }
        @keyframes treasureGlow {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .treasure-scroll-icon {
            fill: #fef9c3;
            stroke: #ca8a04;
            stroke-width: 1.2;
        }
        .map-node {
            cursor: pointer;
        }
        .map-node .node-inner {
            transition: opacity 0.12s ease;
        }
        .map-node:active .node-inner {
            opacity: 0.82;
        }
        .map-node .node-hit {
            fill: transparent;
            stroke: none;
            cursor: pointer;
            pointer-events: all;
        }
        .map-node .node-bg {
            stroke: #fff;
            stroke-width: 3.5;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
            pointer-events: none;
        }
        .map-node.locked .node-bg { fill: #64748b; }
        .map-node.available .node-bg { fill: #22c55e; }
        .map-node.current .node-bg { fill: #fbbf24; animation: pulse 1.2s infinite; }
        .map-node.done-1 .node-bg { fill: #eab308; }
        .map-node.done-2 .node-bg { fill: #f59e0b; }
        .map-node.done-3 .node-bg { fill: #f97316; }
        .map-node .node-emoji {
            fill: #fff;
            font-size: 28px;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .map-node .node-label {
            fill: #e2e8f0;
            font-size: 12px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-node .node-stars {
            fill: #fde68a;
            font-size: 14px;
            text-anchor: middle;
            pointer-events: none;
        }
        .map-node--lg .node-bg { stroke-width: 4; }
        .map-node--lg .node-emoji { font-size: 32px; }
        .map-node--lg .node-label { font-size: 13px; }
        .trail {
            fill: none;
            stroke: rgba(253, 224, 71, 0.55);
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 10 8;
        }

        .game-header {
            width: 100%;
            text-align: center;
        }
        .game-location { font-weight: 700; font-size: 1rem; }
        .round-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }
        .round-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .round-dots .dot.done { background: #22c55e; }
        .round-dots .dot.current { background: #fbbf24; transform: scale(1.2); }

        .mentor {
            width: 100%;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.35);
            font-size: 0.9rem;
            color: #bbf7d0;
        }
        .prompt {
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.35;
            padding: 8px 4px;
        }
        .media { width: 100%; text-align: center; }
        .media img { max-width: 100%; max-height: 200px; border-radius: 12px; }

        .answers.image-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .answer-img-btn {
            padding: 8px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #f8fafc;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }
        .answer-img-btn:active { background: rgba(255,255,255,0.16); }
        .answer-img-btn img {
            width: 100%;
            max-height: 118px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            pointer-events: none;
        }
        .answers.image-grid.fit-contain .answer-img-btn {
            padding: 10px;
            min-height: 148px;
            justify-content: center;
        }
        .answers.image-grid.fit-contain .answer-img-btn img {
            width: auto;
            max-width: 100%;
            height: auto;
            max-height: 128px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.06);
        }
        .answer-img-btn span {
            font-size: 0.82rem;
            font-weight: 600;
            pointer-events: none;
        }
        .answer-img-btn.no-labels span {
            display: none;
        }
        .answer-img-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.28); }
        .answer-img-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.28); }
        .answer-img-btn:disabled { opacity: 0.65; cursor: default; }
        .answer-img-btn.img-missing {
            opacity: 0.35;
            pointer-events: none;
        }

        .feedback-explanation { margin: 0 0 10px; line-height: 1.45; }
        .explanation-media { margin-top: 10px; text-align: center; }
        .explanation-media-link {
            display: inline-block;
            border-radius: 12px;
            overflow: hidden;
            line-height: 0;
        }
        .explanation-media-link img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 2px solid rgba(251, 191, 36, 0.45);
            transition: transform 0.15s ease;
        }
        .explanation-media-link:active img { transform: scale(0.98); }
        .explanation-media-caption { margin: 8px 0 0; font-size: 0.88rem; }
        .explanation-media-caption a { color: #fde68a; text-decoration: underline; }
        #modal-feedback .modal { max-width: min(420px, 94vw); }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .answer-btn {
            padding: 16px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.08);
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }
        .answer-btn:active { background: rgba(255,255,255,0.18); }
        .answer-btn.correct { background: rgba(34,197,94,0.35); border-color: #22c55e; }
        .answer-btn.wrong { background: rgba(239,68,68,0.35); border-color: #ef4444; }
        .answer-btn:disabled { opacity: 0.7; pointer-events: none; }

        .answers.yesno { flex-direction: row; }
        .answers.yesno .answer-btn { flex: 1; }

        .map-tap-svg {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            display: block;
            border-radius: 12px;
            background: rgba(15,23,42,0.5);
        }
        .map-tap-svg path {
            fill: rgba(56,189,248,0.35);
            stroke: #7dd3fc;
            stroke-width: 2;
            cursor: pointer;
        }
        .map-tap-svg path:hover, .map-tap-svg path:focus { fill: rgba(251,191,36,0.5); }
        .map-tap-svg path.highlight { fill: rgba(34,197,94,0.6); }

        .combo-banner {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #f59e0b, #eab308);
            color: #1e293b;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 99px;
            z-index: 50;
            animation: screen-in 0.3s;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-backdrop.active { display: flex; }
        .modal {
            background: linear-gradient(180deg, #1e3a5f, #0f172a);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 24px 20px;
            max-width: 360px;
            width: 100%;
            text-align: center;
        }
        .modal h3 { margin: 0 0 10px; font-size: 1.25rem; }
        .modal p { color: #cbd5e1; margin: 0 0 16px; line-height: 1.4; }
        .modal .stars-big { font-size: 2rem; letter-spacing: 4px; margin: 8px 0; }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            background: #3b82f6;
            color: white;
        }
        .modal-btn:active { opacity: 0.9; }

        .flash {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            opacity: 0;
        }
        .flash.correct { animation: flash-in 0.35s; background: rgba(34,197,94,0.25); }
        .flash.wrong { animation: flash-in 0.35s; background: rgba(239,68,68,0.2); }
        .flash.win { animation: flash-in 0.5s; background: rgba(251,191,36,0.2); }
        @keyframes flash-in {
            0% { opacity: 0; }
            30% { opacity: 1; }
            100% { opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: -20px;
            z-index: 60;
            animation: fall 2.5s forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15,23,42,0.95);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 18px;
            border-radius: 99px;
            z-index: 80;
            font-size: 0.9rem;
        }

        @media (min-width: 560px) {
            .answers.grid { display: grid; grid-template-columns: 1fr 1fr; }
        }

        .map-node.bonus-node .node-bg {
            fill: #a855f7;
            stroke: #f5d0fe;
        }
        .map-node.bonus-node.current .node-bg {
            fill: #fbbf24;
            animation: pulse 1.2s infinite;
        }

        .answers.puzzle-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        .puzzle-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            width: 100%;
        }
        .puzzle-toolbar .puzzle-stat {
            font-size: 0.88rem;
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
        }
        .puzzle-toolbar .btn-mini {
            padding: 8px 14px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.1);
            color: #f8fafc;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .puzzle-toolbar .btn-mini:active { transform: scale(0.97); }
        .puzzle-board {
            display: grid;
            gap: 3px;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 5 / 4;
            padding: 6px;
            border-radius: 14px;
            background: rgba(0,0,0,0.35);
            border: 2px solid rgba(251,191,36,0.35);
            touch-action: manipulation;
        }
        .puzzle-piece {
            position: relative;
            margin: 0;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            cursor: pointer;
            background-color: #1e3a8a;
            background-repeat: no-repeat;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            min-height: 0;
            overflow: hidden;
        }
        .puzzle-piece:active { transform: scale(0.98); }
        .puzzle-piece.selected {
            box-shadow: 0 0 0 3px #fbbf24, inset 0 0 0 1px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .puzzle-piece.correct-slot {
            border-color: rgba(34,197,94,0.35);
        }
        .puzzle-preview {
            width: 100%;
            max-width: 200px;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            opacity: 0.85;
        }
        .answers.match-wrap {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            gap: 10px;
        }
        .match-hint {
            margin: 0;
            text-align: center;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .match-board {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            column-gap: clamp(34px, 9vw, 96px);
            width: 100%;
            padding: 10px;
            border-radius: 14px;
            border: 2px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.5);
        }
        .match-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }
        .match-col.tiles {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            align-content: start;
        }
        .match-item {
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            color: #f8fafc;
            padding: 10px;
            min-height: 52px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .match-item .ico {
            font-size: 1.3rem;
            line-height: 1;
            min-width: 1.3rem;
            text-align: center;
        }
        .match-item .txt {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .match-item:active { transform: scale(0.99); }
        .match-item.image-tile {
            min-height: 84px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 6px;
            padding: 8px 6px;
        }
        .match-item.image-tile .ico {
            font-size: 2rem;
            min-width: 0;
        }
        .match-item.image-tile .txt {
            font-size: 0.75rem;
            line-height: 1.2;
        }
        .match-photo {
            width: 100%;
            max-width: 148px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(15, 23, 42, 0.45);
            display: block;
        }
        .match-photo.flag {
            max-width: 180px;
            height: 96px;
            object-fit: contain;
            background: rgba(255,255,255,0.05);
        }
        .match-item.selected {
            border-color: #fbbf24;
            box-shadow: 0 0 0 2px rgba(251,191,36,0.35);
        }
        .match-item.matched {
            border-color: rgba(34,197,94,0.6);
            background: rgba(34,197,94,0.2);
            cursor: default;
        }
        .match-item.mismatch {
            border-color: rgba(239,68,68,0.7);
            background: rgba(239,68,68,0.2);
        }
        .match-lines {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: visible;
        }
    </style>
</head>

<script>
(function () {
    "use strict";

    const STORAGE_KEY = "geoQuest:v1";
    const UNLOCK_MIN_STARS = 2;
    const MAX_STARS_TOTAL = 30;

    /** Lat/lon bounds for picking continents on the globe (approximate). */
    const LAND_PICKERS = [
        { id: "antarctica", test(lat, lon) { return lat < -60; } },
        { id: "oceania", test(lat, lon) { return lat >= -50 && lat <= 12 && lon >= 95 && lon <= 180; } },
        { id: "south-america", test(lat, lon) { return lat >= -56 && lat <= 15 && lon >= -82 && lon <= -34; } },
        { id: "north-america", test(lat, lon) { return lat >= 12 && lat <= 72 && lon >= -170 && lon <= -52; } },
        { id: "europe", test(lat, lon) { return lat >= 36 && lat <= 72 && lon >= -30 && lon <= 60; } },
        { id: "africa", test(lat, lon) { return lat >= -35 && lat <= 37 && lon >= -20 && lon <= 52; } },
        {
            id: "asia",
            test(lat, lon) {
                if (lat < -8 || lat > 77) return false;
                return (lon >= 25 && lon <= 180) || (lon >= -180 && lon <= -168);
            }
        }
    ];

    const PRAISE = [
        "Чудово, досліднику!",
        "Саме так! Ти на карті!",
        "Відмінна географія!",
        "Капітан гордиться!",
        "Ще одна перемога!"
    ];
    const ENCOURAGE = [
        "Нічого страшного — вчимося разом!",
        "Ось підказка:",
        "Спробуй ще раз наступного разу!",
        "Головне — запам’ятати:"
    ];

    const DEFAULT_SAVE = {
        version: 1,
        coins: 0,
        totalStars: 0,
        comboBest: 0,
        soundOn: true,
        voiceOn: false,
        lastPlayed: null,
        continents: {},
        badges: []
    };

    const hubScreen = document.getElementById("screen-hub");
    const mapScreen = document.getElementById("screen-map");
    const gameScreen = document.getElementById("screen-game");
    const screens = [hubScreen, mapScreen, gameScreen];

    const starsCountEl = document.getElementById("stars-count");
    const coinsCountEl = document.getElementById("coins-count");
    const hubScene = document.getElementById("hub-scene");
    const orbitRing = document.getElementById("orbit-ring");
    const globeWrap = document.getElementById("globe-wrap");
    const globeCanvas = document.getElementById("globe-canvas");
    const mapSvg = document.getElementById("map-svg");
    const mapTitle = document.getElementById("map-title");
    const gameLocation = document.getElementById("game-location");
    const roundDots = document.getElementById("round-dots");
    const mentorBubble = document.getElementById("mentor-bubble");
    const gamePrompt = document.getElementById("game-prompt");
    const gameMedia = document.getElementById("game-media");
    const gameAnswers = document.getElementById("game-answers");
    const flashEl = document.getElementById("flash");
    const mapBonusActions = document.getElementById("map-bonus-actions");
    const soundToggle = document.getElementById("sound-toggle");
    const voiceToggle = document.getElementById("voice-toggle");

    const gameBase = (() => {
        const m = location.pathname.match(/^(.*\/games\/[^/]+)/);
        return (m ? m[1] : location.pathname.replace(/\/[^/]*$/, "")) + "/";
    })();
    const url = (p) => gameBase + p.replace(/^\//, "");

    function loadSave() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
            return { ...DEFAULT_SAVE, ...JSON.parse(raw) };
        } catch (_) {
            return JSON.parse(JSON.stringify(DEFAULT_SAVE));
        }
    }
    function saveSave() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(save)); } catch (_) {}
    }
    const save = loadSave();

    const audio = (() => {
        let ctx = null;
        function ensure() {
            if (!ctx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();
            }
            if (ctx.state === "suspended") ctx.resume();
            return ctx;
        }
        function tone(freq, dur, type = "sine", gain = 0.12, when = 0) {
            if (!save.soundOn) return;
            const c = ensure();
            if (!c) return;
            const t0 = c.currentTime + when;
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            g.gain.setValueAtTime(0, t0);
            g.gain.linearRampToValueAtTime(gain, t0 + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g).connect(c.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }
        return {
            tap: () => tone(660, 0.05, "triangle", 0.08),
            select: () => { tone(523, 0.08, "triangle", 0.1); tone(784, 0.1, "triangle", 0.1, 0.05); },
            correct: () => [659, 880, 1175].forEach((f, i) => tone(f, 0.18, "triangle", 0.12, i * 0.07)),
            wrong: () => { tone(220, 0.22, "sawtooth", 0.1); tone(165, 0.34, "sawtooth", 0.09, 0.08); },
            star: () => { tone(1175, 0.1); tone(1760, 0.14, "sine", 0.1, 0.06); },
            coin: () => { tone(880, 0.08, "square", 0.08); tone(1320, 0.12, "square", 0.08, 0.05); },
            win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, "triangle", 0.12, i * 0.1))
        };
    })();

    const voice = (() => {
        const supported = "speechSynthesis" in window;
        let ukVoice = null;
        function pick() {
            if (!supported) return;
            ukVoice = speechSynthesis.getVoices().find(v => /^uk/i.test(v.lang)) || null;
        }
        if (supported) {
            pick();
            speechSynthesis.onvoiceschanged = pick;
        }
        return {
            speak(text) {
                if (!supported || !save.voiceOn || !text) return;
                try {
                    speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(text);
                    u.lang = "uk-UA";
                    if (ukVoice) u.voice = ukVoice;
                    speechSynthesis.speak(u);
                } catch (_) {}
            },
            stop() {
                if (supported) try { speechSynthesis.cancel(); } catch (_) {}
            }
        };
    })();

    function randomPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function shuffleArray(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
        }
        return copy;
    }

    /** Shuffle answer options each time a round is shown (new order on replay). */
    function prepareRoundChoices(round) {
        if (!round) return null;
        if (round.type === "yesno") {
            return shuffleArray([
                { label: "Так", value: true },
                { label: "Ні", value: false },
            ]);
        }
        if (round.type === "imageQuiz" && round.answers) {
            return shuffleArray(
                round.answers.map((ans, idx) => ({
                    label: ans.label || "",
                    image: ans.image,
                    isCorrect: idx === round.correct,
                }))
            );
        }
        if (round.answers && typeof round.correct === "number") {
            return shuffleArray(
                round.answers.map((text, idx) => ({
                    text: text,
                    isCorrect: idx === round.correct,
                }))
            );
        }
        return null;
    }
    function flash(kind) {
        flashEl.className = "flash " + kind;
        void flashEl.offsetWidth;
        setTimeout(() => { flashEl.className = "flash"; }, 400);
    }
    function shake() {
        document.body.classList.remove("shake");
        void document.body.offsetWidth;
        document.body.classList.add("shake");
        setTimeout(() => document.body.classList.remove("shake"), 450);
    }
    function confetti(n = 28) {
        const em = ["🎉", "⭐", "🪙", "🌍", "✨"];
        for (let i = 0; i < n; i++) {
            const el = document.createElement("span");
            el.className = "confetti";
            el.textContent = em[i % em.length];
            el.style.left = Math.random() * 100 + "vw";
            el.style.fontSize = 14 + Math.random() * 16 + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 2800);
        }
    }
    function toast(msg) {
        const el = document.createElement("div");
        el.className = "toast-msg";
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
    }
    function showComboBanner(text) {
        const el = document.createElement("div");
        el.className = "combo-banner";
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
    }

    function continentSave(id) {
        if (!save.continents[id]) save.continents[id] = { nodes: {} };
        return save.continents[id];
    }
    function nodeStars(continentId, nodeId) {
        return save.continents[continentId]?.nodes[nodeId]?.stars || 0;
    }
    function recalcTotalStars() {
        let t = 0;
        for (const cid in save.continents) {
            const nodes = save.continents[cid].nodes || {};
            for (const nid in nodes) t += nodes[nid].stars || 0;
        }
        save.totalStars = t;
    }
    function updateHud(animate) {
        starsCountEl.textContent = save.totalStars;
        coinsCountEl.textContent = save.coins;
        document.getElementById("footer-stars").textContent =
            "Зірки: " + save.totalStars + " / " + MAX_STARS_TOTAL;
        document.getElementById("footer-badges").textContent =
            "Бейджі: " + (save.badges?.length || 0);
        if (animate === "stars") {
            starsCountEl.parentElement.classList.remove("pop");
            void starsCountEl.parentElement.offsetWidth;
            starsCountEl.parentElement.classList.add("pop");
        }
        if (animate === "coins") {
            coinsCountEl.parentElement.classList.remove("pop");
            void coinsCountEl.parentElement.offsetWidth;
            coinsCountEl.parentElement.classList.add("pop");
        }
    }

    soundToggle.addEventListener("click", () => {
        save.soundOn = !save.soundOn;
        saveSave();
        soundToggle.textContent = save.soundOn ? "🔊" : "🔇";
        if (save.soundOn) audio.tap();
    });
    voiceToggle.addEventListener("click", () => {
        save.voiceOn = !save.voiceOn;
        saveSave();
        voiceToggle.textContent = save.voiceOn ? "🗣️" : "🔇";
        if (save.voiceOn) voice.speak("Озвучка увімкнена");
        else voice.stop();
    });
    soundToggle.textContent = save.soundOn ? "🔊" : "🔇";
    voiceToggle.textContent = save.voiceOn ? "🗣️" : "🔇";

    function showScreen(el) {
        voice.stop();
        screens.forEach(s => s.classList.toggle("active", s === el));
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    let world = null;
    const continentCache = {};
    const mapCache = {};
    const mapGeoCache = {};

    async function fetchJson(path) {
        const res = await fetch(url(path));
        if (!res.ok) throw new Error(path + " HTTP " + res.status);
        return res.json();
    }

    async function loadWorld() {
        if (world) return world;
        world = await fetchJson("data/world.json");
        return world;
    }

    async function loadContinentData(meta) {
        const key = meta.id;
        if (continentCache[key]) return continentCache[key];
        const data = await fetchJson(meta.file);
        if (data.nodes) {
            for (const node of data.nodes) {
                if (node.roundsFile) {
                    const extra = await fetchJson(node.roundsFile);
                    const extraRounds = extra.rounds || extra;
                    node.rounds = [...(node.rounds || []), ...extraRounds];
                }
            }
        }
        continentCache[key] = data;
        return data;
    }

    async function loadMap(mapId) {
        if (mapCache[mapId]) return mapCache[mapId];
        const data = await fetchJson("data/maps/" + mapId + ".json");
        mapCache[mapId] = data;
        return data;
    }

    async function loadContinentGeo(continentData) {
        const geoFile = continentData.map?.geoFile;
        if (!geoFile) return null;
        if (mapGeoCache[continentData.id]) return mapGeoCache[continentData.id];
        const data = await fetchJson(geoFile);
        mapGeoCache[continentData.id] = data;
        return data;
    }

    function nodeGeoId(node) {
        return node.countryId || node.regionId || node.id;
    }

    function findGeoFeature(geo, node) {
        if (!geo) return null;
        const id = nodeGeoId(node);
        const list = geo.countries || geo.regions || [];
        return list.find(f => f.id === id) || null;
    }

    const MAP_MARKER_PAD = 58;

    function clampMapPoint(x, y, w, h, pad) {
        return {
            x: Math.min(w - pad, Math.max(pad, x)),
            y: Math.min(h - pad, Math.max(pad, y)),
        };
    }

    function getNodeCenter(geo, node) {
        const f = findGeoFeature(geo, node);
        const pt = (f && (f.marker || f.center)) || null;
        if (!pt) return null;
        if (geo && geo.viewBox) {
            const vb = geo.viewBox.split(/\s+/).map(Number);
            const pad = geo.markerPadding ?? MAP_MARKER_PAD;
            return clampMapPoint(pt.x, pt.y, vb[2] || 1000, vb[3] || 780, pad);
        }
        return { x: pt.x, y: pt.y };
    }

    function buildFlexibleTrail(positions) {
        if (positions.length < 2) return "";
        const pts = positions.map(p => ({ x: p.x, y: p.y }));
        let d = "M" + pts[0].x.toFixed(1) + "," + pts[0].y.toFixed(1);
        for (let i = 1; i < pts.length; i++) {
            const a = pts[i - 1];
            const b = pts[i];
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            const bend = Math.min(110, len * 0.42) * (i % 2 === 0 ? 1 : -1);
            const cx = mx + (-dy / len) * bend;
            const cy = my + (dx / len) * bend;
            d += " Q" + cx.toFixed(1) + "," + cy.toFixed(1) + " " +
                b.x.toFixed(1) + "," + b.y.toFixed(1);
        }
        return d;
    }

    function renderOceanTrailStars(geo, nodes) {
        let html = "";

        let doneTrail = 0;
        for (const node of nodes) {
            if (nodeStars(currentData.id, node.id) >= 2) doneTrail++;

        const starsPerSegment = Math.max(1, Math.floor(stars.length / Math.max(1, nodes.length)));
        stars.forEach((s, i) => {
            const done = i < doneTrail * starsPerSegment;
            html += '<text class="ocean-trail-star ' + (done ? "done" : "pending") + '" x="' +
                s.x + '" y="' + s.y + '">★</text>';

    function canUnlockNode(node, data) {
        const u = node.unlock;
        if (u?.type === "bonus") {
            const need = u.minStars ?? UNLOCK_MIN_STARS;
            const main = data.nodes.filter(n => !n.bonus);
            return main.length > 0 && main.every(n => nodeStars(data.id, n.id) >= need);
        }
        if (!u || u.type === "free") return true;
        if (!u.requires) return true;
        const prevStars = nodeStars(data.id, u.requires);
        return prevStars >= (u.minStars ?? UNLOCK_MIN_STARS);
    }

    function findPrevNode(node, data) {
        const u = node.unlock;
        if (!u || !u.requires) return null;
        return data.nodes.find(n => n.id === u.requires) || null;
    }

        if (ratio >= 0.8 && comboMax >= 3) return 3;
        if (ratio >= 0.8) return 2;
        return 1;
    }

        "#22d3ee", "#facc15", "#fb7185", "#34d399", "#a78bfa", "#fb923c",

    function loadImage(src, crossOrigin) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            if (crossOrigin) img.crossOrigin = "anonymous";
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("image load failed"));
            img.src = src;
        });
    }

    function pathBBox(pathStr) {
        const nums = pathStr.match(/-?\d+(?:\.\d+)?/g);
        if (!nums || nums.length < 4) return null;
        let minX = Infinity;
        let minY = Infinity;
        let maxX = -Infinity;
        let maxY = -Infinity;
        for (let i = 0; i + 1 < nums.length; i += 2) {
            const x = +nums[i];
            const y = +nums[i + 1];
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
        }
        if (!isFinite(minX)) return null;
        return { minX, minY, maxX, maxY, w: maxX - minX, h: maxY - minY };
    }

    function drawPuzzleCountry(ctx, country, colorIndex, sx, sy, ox, oy) {
        const p = new Path2D(country.path);
        ctx.save();
        ctx.translate(ox, oy);
        ctx.scale(sx, sy);
        ctx.fillStyle = PUZZLE_NATURAL_COLORS[colorIndex % PUZZLE_NATURAL_COLORS.length];
        ctx.fill(p);
        ctx.strokeStyle = PUZZLE_OUTLINE_COLORS[colorIndex % PUZZLE_OUTLINE_COLORS.length];
        ctx.lineWidth = 2;
        ctx.stroke(p);
        ctx.restore();
    }

    async function buildEuropePuzzleImage(mapId, options) {
        const countryId = options && options.countryId;
        const cacheKey = (mapId || "europe-countries") + (countryId ? ":" + countryId : "");
        if (puzzleImageCache[cacheKey]) return puzzleImageCache[cacheKey];
        const mapData = await loadMap(mapId);
        const parts = (mapData.viewBox || "0 0 1000 780").split(/\s+/).map(Number);
        const vw = parts[2] || 1000;
        const vh = parts[3] || 780;
        const cw = countryId ? 360 : 500;
        const ch = countryId ? 480 : 400;
        const canvas = document.createElement("canvas");
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext("2d");
        const seaGrad = ctx.createLinearGradient(0, 0, 0, ch);
        seaGrad.addColorStop(0, "#2563eb");
        seaGrad.addColorStop(0.55, "#1d4ed8");
        seaGrad.addColorStop(1, "#1e3a8a");
        ctx.fillStyle = seaGrad;
        ctx.fillRect(0, 0, cw, ch);

        const countries = (mapData.countries || []).filter((c) => c.path && c.id !== "europe-puzzle");
        if (countryId) {
            const country = countries.find((c) => c.id === countryId);
            if (country) {
                const bbox = pathBBox(country.path);
                if (bbox && bbox.w > 0 && bbox.h > 0) {
                    const pad = 20;
                    const scale = Math.min((cw - pad * 2) / bbox.w, (ch - pad * 2) / bbox.h);
                    const ox = (cw - bbox.w * scale) / 2 - bbox.minX * scale;
                    const oy = (ch - bbox.h * scale) / 2 - bbox.minY * scale;
                    drawPuzzleCountry(ctx, country, 0, scale, scale, ox, oy);
                }
            }
        } else {
            const sx = cw / vw;
            const sy = ch / vh;
            countries.forEach((c, i) => drawPuzzleCountry(ctx, c, i, sx, sy, 0, 0));
        }
        const url = canvas.toDataURL("image/png");
        puzzleImageCache[cacheKey] = url;
        return url;
    }

    function hashTilePixels(pixels) {
        let hash = 2166136261 >>> 0;
        for (let i = 0; i < pixels.length; i += 4) {
            hash ^= pixels[i];
            hash = Math.imul(hash, 16777619);
            hash ^= pixels[i + 1];
            hash = Math.imul(hash, 16777619);
            hash ^= pixels[i + 2];
            hash = Math.imul(hash, 16777619);
            hash ^= pixels[i + 3];
            hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(16);
    }

    async function buildPieceSignatures(imageUrl, cols, rows) {
        const img = await loadImage(imageUrl, false);
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        const tw = Math.floor(canvas.width / cols);
        const th = Math.floor(canvas.height / rows);
        const signatures = [];
        for (let idx = 0; idx < cols * rows; idx++) {
            const col = idx % cols;
            const row = Math.floor(idx / cols);
            const x = col * tw;
            const y = row * th;
            const w = col === cols - 1 ? (canvas.width - x) : tw;
            const h = row === rows - 1 ? (canvas.height - y) : th;
            const data = ctx.getImageData(x, y, w, h).data;
            signatures.push(hashTilePixels(data));
        }
        return signatures;
    }

    function parseGraphicValue(raw, fallbackIcon) {
        const text = String(raw || "");
        const first = text.split(/\s+/).find(Boolean) || "";
        const hasEmoji = /[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(first);
        if (hasEmoji) {
            return { icon: first, text: text.replace(first, "").trim() };
        }
        return { icon: fallbackIcon || "🖼️", text };
    }

    function stableSeed(str) {
        let h = 5381;
        for (let i = 0; i < str.length; i++) h = ((h << 5) + h) + str.charCodeAt(i);
        return Math.abs(h);
    }

    function graphicImageUrl(kind, countryId, countryName, label) {
        if (kind === "flag") {
            const iso2 = COUNTRY_ISO2[countryId];
            if (iso2) return "https://flagcdn.com/w320/" + iso2 + ".png";
        }
        const seed = stableSeed(countryId + ":" + kind);
        if (kind === "coat") {
            const tags = encodeURIComponent(countryName + ",heraldry,coat of arms,shield");
            return "https://loremflickr.com/360/240/" + tags + "?lock=" + seed;
        }
        if (kind === "clothing") {
            const tags = encodeURIComponent(countryName + ",traditional costume,national dress");
            return "https://loremflickr.com/360/240/" + tags + "?lock=" + seed;
        }
        return "";
    }

    async function fetchCoatImage(countryId) {
        if (COAT_IMAGE_CACHE[countryId] !== undefined) return COAT_IMAGE_CACHE[countryId];
        const iso2 = COUNTRY_ISO2[countryId];
        if (!iso2) {
            COAT_IMAGE_CACHE[countryId] = "";
            return "";
        }
        const endpoint = "https://restcountries.com/v3.1/alpha/" + iso2 + "?fields=coatOfArms";
        try {
            const res = await fetch(endpoint, { cache: "force-cache" });
            if (!res.ok) throw new Error("coat http " + res.status);
            const data = await res.json();
            const entry = Array.isArray(data) ? data[0] : data;
            const coat = entry?.coatOfArms || {};
            const src = coat.png || coat.svg || "";
            COAT_IMAGE_CACHE[countryId] = src || "";
            return COAT_IMAGE_CACHE[countryId];
        } catch (_) {
            COAT_IMAGE_CACHE[countryId] = "";
            return "";
        }
    }

    async function hydrateCoatImages(items) {
        await Promise.all(items.map(async (item) => {
            if (!item || item.imageKind !== "coat") return;
            const fromApi = await fetchCoatImage(item.id);
            item.image = fromApi || item.fallbackImage || "";
        }));
    }

    function buildMatchRoundPairs(round) {
        const kind = round.pairKind;
        const count = Math.max(2, Math.min(10, round.count || 7));
        const pool = EUROPE_MATCH_BANK.filter((c) => c.country && c[kind]);
        const ukraine = pool.find((c) => c.id === "ukraine");
        const rest = pool.filter((c) => c.id !== "ukraine");
        const pickCount = Math.min(count, pool.length);
        let picked = [];
        if (ukraine && pickCount > 0) {
            picked.push(ukraine);
            picked = picked.concat(shuffleArray(rest).slice(0, pickCount - 1));
        } else {
            picked = shuffleArray(pool).slice(0, pickCount);
        }
        const left = shuffleArray(picked.map((c) => ({
            id: c.id,
            text: c.country,
            icon: kind === "flag" ? "🌍" : c.flag
        })));
        const right = shuffleArray(picked.map((c) => {
            const value = c[kind];
            if (kind === "flag") {
                return {
                    id: c.id,
                    text: "",
                    icon: "",
                    image: graphicImageUrl("flag", c.id, c.country, value),
                    graphic: true,
                    imageKind: "flag"
                };
            }
            if (kind === "coat") {
                const parsed = parseGraphicValue(value, "🛡️");
                return {
                    id: c.id,
                    text: parsed.text || c.country,
                    icon: parsed.icon,
                    image: "",
                    fallbackImage: graphicImageUrl("coat", c.id, c.country, parsed.text),
                    graphic: true,
                    imageKind: "coat"
                };
            }
            if (kind === "clothing") {
                const parsed = parseGraphicValue(value, "👘");
                return {
                    id: c.id,
                    text: parsed.text || c.country,
                    icon: parsed.icon,
                    image: graphicImageUrl("clothing", c.id, c.country, parsed.text),
                    graphic: true,
                    imageKind: "clothing"
                };
            }
            if (kind === "geo") {
                const geoMeta = GEO_TYPE_BY_COUNTRY[c.id] || { type: "географічний об'єкт", icon: "🗺️" };
                return {
                    id: c.id,
                    text: value + " — " + geoMeta.type,
                    icon: geoMeta.icon,
                    graphic: false
                };
            }
            return { id: c.id, text: value, icon: "•", graphic: false };
        }));
        return { left, right };
    }

        /** Яка точка на Землі в центрі екрана при заданих кутах камери. */
        function centerGeoAtAngles(viewLonDeg, viewTiltDeg) {
            const lonR = viewLonDeg * Math.PI / 180;
            const tiltR = viewTiltDeg * Math.PI / 180;
            const cosY = Math.cos(-lonR);
            const sinY = Math.sin(-lonR);
            const x1 = sinY;
            const z1 = cosY;
            const cosX = Math.cos(-tiltR);
            const sinX = Math.sin(-tiltR);
            const y2 = -z1 * sinX;
            const z2 = z1 * cosX;
            const x2 = x1;
            const lat = Math.asin(Math.max(-1, Math.min(1, y2))) * (180 / Math.PI);
            const ln = Math.atan2(x2, z2) * (180 / Math.PI);
            return { lat, lon: normLon(ln) };
        }

        function geoAngularDist(a, b) {
            const φ1 = a.lat * Math.PI / 180;
            const φ2 = b.lat * Math.PI / 180;
            const Δλ = (b.lon - a.lon) * Math.PI / 180;
            const h = Math.sin((φ2 - φ1) / 2) ** 2 +
                Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return 2 * Math.asin(Math.min(1, Math.sqrt(h)));
        }

        /** Підбирає lon/tilt, щоб (lat0, lon0) опинилась у центрі диска. */
        function anglesToCenterGeo(lat0, lon0) {
            let bestLon = lon0;
            let bestTilt = lat0;
            let bestD = 1e9;
            const target = { lat: lat0, lon: normLon(lon0) };

            function search(lonMin, lonMax, tiltMin, tiltMax, step) {
                for (let t = tiltMin; t <= tiltMax; t += step) {
                    for (let l = lonMin; l <= lonMax; l += step) {
                        const c = centerGeoAtAngles(normLon(l), clampTilt(t));
                        const d = geoAngularDist(c, target);
                        if (d < bestD) {
                            bestD = d;
                            bestLon = l;
                            bestTilt = t;
                        }
                    }
                }
            }

            search(lon0 - 40, lon0 + 40, lat0 - 35, lat0 + 35, 0.5);
            search(bestLon - 3, bestLon + 3, bestTilt - 3, bestTilt + 3, 0.08);
            return { lon: normLon(bestLon), tilt: clampTilt(bestTilt) };
        }

        /** Камера: R_y(lon) · R_x(tilt). Зворотне перетворення променя виду → lat/lon. */
        function viewToLatLon(nx, ny, nz) {
            const lonR = lon * Math.PI / 180;
            const tiltR = tilt * Math.PI / 180;
            const cosY = Math.cos(-lonR);
            const sinY = Math.sin(-lonR);
            const x1 = nx * cosY + nz * sinY;
            const z1 = -nx * sinY + nz * cosY;
            const y1 = ny;
            const cosX = Math.cos(-tiltR);
            const sinX = Math.sin(-tiltR);
            const x2 = x1;
            const y2 = y1 * cosX - z1 * sinX;
            const z2 = y1 * sinX + z1 * cosX;
            const lat = Math.asin(Math.max(-1, Math.min(1, y2))) * (180 / Math.PI);
            const ln = Math.atan2(x2, z2) * (180 / Math.PI);
            return { lat, lon: normLon(ln) };
        }

        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }

        function applyTransform() {
            globeWrap.style.transform = "translate(-50%, -50%) scale(" + zoom.toFixed(3) + ")";
        }

        function sampleTexture(u, v) {
            const x = Math.min(texW - 1, Math.max(0, Math.floor(u * texW)));
            const y = Math.min(texH - 1, Math.max(0, Math.floor(v * texH)));
            const i = (y * texW + x) * 4;
            return [texPixels[i], texPixels[i + 1], texPixels[i + 2]];
        }

        function canvasPixelToLatLon(px, py, size) {
            const cx = size / 2;
            const cy = size / 2;
            const R = size / 2 * 0.96;
            const nx = (px - cx) / R;
            const ny = -(py - cy) / R;
            if (nx * nx + ny * ny > 1) return null;
            const nz = Math.sqrt(1 - nx * nx - ny * ny);
            return viewToLatLon(nx, ny, nz);
        }

        function draw() {
            if (!ready || !texPixels) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const display = Math.min(globeCanvas.clientWidth, globeCanvas.clientHeight) || 220;
            const size = Math.max(64, Math.floor(display * dpr));
            if (globeCanvas.width !== size || globeCanvas.height !== size) {
                globeCanvas.width = size;
                globeCanvas.height = size;
            }
            const ctx = globeCanvas.getContext("2d", { willReadFrequently: true });
            const img = ctx.createImageData(size, size);
            const data = img.data;
            const cx = size / 2;
            const cy = size / 2;
            const R = size / 2 * 0.96;

            for (let py = 0; py < size; py++) {
                for (let px = 0; px < size; px++) {
                    const i = (py * size + px) * 4;
                    const nx = (px - cx) / R;
                    const ny = -(py - cy) / R;
                    const d2 = nx * nx + ny * ny;
                    if (d2 > 1) {
                        data[i + 3] = 0;
                        continue;
                    }
                    const nz = Math.sqrt(1 - d2);
                    const { lat, lon: ln } = viewToLatLon(nx, ny, nz);
                    let u = (ln + 180) / 360;
                    const v = (90 - lat) / 180;
                    const rgb = sampleTexture(u, v);
                    const light = 0.45 + 0.55 * Math.max(0, nz * 0.85 + nx * 0.15);
                    data[i] = Math.min(255, rgb[0] * light);
                    data[i + 1] = Math.min(255, rgb[1] * light);
                    data[i + 2] = Math.min(255, rgb[2] * light);
                    data[i + 3] = 255;
                }
            }
            ctx.putImageData(img, 0, 0);
            ctx.globalCompositeOperation = "destination-over";
            const atmo = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 1.02);
            atmo.addColorStop(0, "rgba(30, 100, 180, 0)");
            atmo.addColorStop(1, "rgba(10, 40, 90, 0.35)");
            ctx.fillStyle = atmo;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = "source-over";
        }

        function tick(now) {
            if (!lastFrame) lastFrame = now;
            const dt = Math.min(48, now - lastFrame);
            lastFrame = now;
            if (ready && autoRotate && !dragging && !animating) {
                lon = normLon(lon + (AUTO_ROTATE_DEG_PER_SEC * dt) / 1000);
                draw();
            }
            loopId = requestAnimationFrame(tick);
        }

        function loadTexture() {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement("canvas");
                    c.width = img.naturalWidth;
                    c.height = img.naturalHeight;
                    c.getContext("2d").drawImage(img, 0, 0);
                    const id = c.getContext("2d").getImageData(0, 0, c.width, c.height);
                    texPixels = id.data;
                    texW = c.width;
                    texH = c.height;
                    ready = true;
                    applyTransform();
                    draw();
                    if (!loopId) loopId = requestAnimationFrame(tick);
                    resolve();
                };
                img.onerror = () => reject(new Error("earth texture"));
                img.src = url("assets/earth-equirect.jpg");
            });
        }

        function onPointerDown(e) {
            if (animating) return;
            dragging = true;
            moved = false;
            lastX = e.clientX;
            lastY = e.clientY;
            globeCanvas.classList.add("dragging");
            globeCanvas.setPointerCapture(e.pointerId);
        }

        function onPointerMove(e) {
            if (!dragging || animating) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
            lastX = e.clientX;
            lastY = e.clientY;
            lon = normLon(lon + dx * 0.35);
            tilt = clampTilt(tilt - dy * 0.22);
            draw();
        }

        function onPointerUp(e) {
            if (!dragging) return;
            dragging = false;
            globeCanvas.classList.remove("dragging");
            try { globeCanvas.releasePointerCapture(e.pointerId); } catch (_) {}
            if (animating) return;
            if (!moved) {
                const rect = globeCanvas.getBoundingClientRect();
                const scale = globeCanvas.width / rect.width;
                const px = (e.clientX - rect.left) * scale;
                const py = (e.clientY - rect.top) * scale;
                const hit = canvasPixelToLatLon(px, py, globeCanvas.width);
                if (hit) {
                    const cid = pickContinentAtLatLon(hit.lat, hit.lon);
                    if (cid) {
                        const meta = getRegionList().find(r => r.id === cid);
                        if (meta) beginRegionFlight(meta);
                    } else {
                        toast("Це океан — обери материк або плитку 🌊");
                        audio.tap();
                    }
                }
            }
        }

        function flyTo(meta) {
            const geo = REGION_GEO_CENTERS[meta.id] || { lat: 0, lon: 0 };
            const aimed = anglesToCenterGeo(geo.lat, geo.lon);
            const targetLon = aimed.lon;
            const targetTilt = aimed.tilt;
            const startLon = lon;
            const startTilt = tilt;
            const startZoom = zoom;
            animating = true;
            autoRotate = false;
            hubScene.classList.add("flight");
            hubScreen.classList.add("flight-active");

            return new Promise(resolve => {
                const t0 = performance.now();
                const total = FLIGHT_ROTATE_MS + FLIGHT_ZOOM_MS;

                function frame(now) {
                    const elapsed = now - t0;
                    if (elapsed < FLIGHT_ROTATE_MS) {
                        const t = easeInOut(elapsed / FLIGHT_ROTATE_MS);
                        lon = lerpLon(startLon, targetLon, t);
                        tilt = lerpTilt(startTilt, targetTilt, t);
                        zoom = startZoom;
                    } else if (elapsed < total) {
                        lon = targetLon;
                        tilt = targetTilt;
                        const t = easeInOut((elapsed - FLIGHT_ROTATE_MS) / FLIGHT_ZOOM_MS);
                        zoom = startZoom + (FLIGHT_MAX_ZOOM - startZoom) * t;
                    } else {
                        lon = targetLon;
                        tilt = targetTilt;
                        zoom = FLIGHT_MAX_ZOOM;
                        applyTransform();
                        draw();
                        resolve();
                        return;
                    }
                    applyTransform();
                    draw();
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            });
        }

        function resetView() {
            animating = false;
            autoRotate = true;
            zoom = 1;
            tilt = 0;
            applyTransform();
            hubScene.classList.remove("flight");
            hubScreen.classList.remove("flight-active");
            draw();
        }

        globeCanvas.addEventListener("pointerdown", onPointerDown);
        globeCanvas.addEventListener("pointermove", onPointerMove);
        globeCanvas.addEventListener("pointerup", onPointerUp);
        globeCanvas.addEventListener("pointercancel", onPointerUp);
        window.addEventListener("resize", () => { if (ready) draw(); });

        return {
            loadTexture,
            flyTo,
            resetView,
            setView(lonDeg, tiltDeg) {
                lon = normLon(lonDeg);
                tilt = clampTilt(tiltDeg || 0);
                draw();
            },
            setGeoCenter(latDeg, lonDeg) {
                const a = anglesToCenterGeo(latDeg, lonDeg);
                lon = a.lon;
                tilt = a.tilt;
                draw();
            },
            isAnimating: () => animating
        };
    })();

    let flightBusy = false;

    async function beginRegionFlight(meta) {
        if (flightBusy || globe.isAnimating()) return;
        if (isComingSoon(meta)) {
            toast("Скоро відкриється!");
            audio.tap();
            return;
        }
        if (!hubScreen.classList.contains("active")) {
            await openRegionAfterFlight(meta);
            return;
        }
        flightBusy = true;
        const resumeBtn = document.getElementById("btn-resume");
        resumeBtn.disabled = true;
        try {
            const dataPromise = loadContinentData(meta);
            await globe.flyTo(meta);
            await dataPromise;
            await openRegionAfterFlight(meta);
        } finally {
            flightBusy = false;
            resumeBtn.disabled = false;
        }
    }

    async function openRegionAfterFlight(meta) {
        audio.select();
        currentRegion = meta;
        currentData = continentCache[meta.id] || await loadContinentData(meta);
        save.lastPlayed = { continentId: meta.id, nodeId: save.lastPlayed?.nodeId };
        saveSave();
        highlightOrbitChip(meta.id);
        await renderMap();
        showScreen(mapScreen);
        globe.resetView();
    }

    function nodeStatusClass(node, data) {
        if (!canUnlockNode(node, data)) return "locked";
        const stars = nodeStars(data.id, node.id);
        if (stars >= 3) return "done-3";
        if (stars >= 2) return "done-2";
        if (stars >= 1) return "done-1";
        if (!node.bonus) {
            const firstOpen = data.nodes.find(n =>
                !n.bonus && canUnlockNode(n, data) && nodeStars(data.id, n.id) < 3);
            if (firstOpen && firstOpen.id === node.id) return "current";
        } else if (stars === 0) {
            return "current";
        }
        return "available";
    }

    async function renderMap() {
        if (!currentData) return;
        mapTitle.textContent = currentData.title;
        const geo = await loadContinentGeo(currentData);
        const vb = (geo && geo.viewBox) || currentData.map?.viewBox || "0 0 1000 780";
        mapSvg.setAttribute("viewBox", vb);
        const parts = vb.split(/\s+/).map(Number);
        const w = parts[2] || 1000;
        const h = parts[3] || 780;

        let html = "";
        const isOceanAdventure = geo && geo.theme === "adventure";
        if (isOceanAdventure) {
            html += renderOceanMapLayers(geo, w, h);
        } else {
            html += '<rect width="' + w + '" height="' + h + '" fill="' +
                (geo && geo.background ? geo.background : "#1e3a8a") + '"/>';
        }

        const features = geo ? (geo.countries || geo.regions || []) : [];
        const playableIds = new Set(currentData.nodes.filter(n => !n.bonus).map(n => nodeGeoId(n)));
        const starsByNode = {};
        for (const node of currentData.nodes.filter(n => !n.bonus)) {
            starsByNode[nodeGeoId(node)] = nodeStars(currentData.id, node.id);
        }

        if (!isOceanAdventure) {
            for (const f of features) {
                const isPlayable = playableIds.has(f.id);
                const stars = starsByNode[f.id] || 0;
                let extra = "";
                if (isPlayable && stars > 0) extra = " done";
                html += '<path class="map-geo' + (isPlayable ? " playable" + extra : " context") +
                    '" data-geo-id="' + f.id + '" d="' + f.path + '"/>';
            }
        }

        if (isOceanAdventure) {
            html += renderOceanDecorations(geo);
        }

        const mainNodes = currentData.nodes.filter(n => !n.bonus);
        const positions = mainNodes.map(node => {
            const c = getNodeCenter(geo, node);
            return { node, x: c ? c.x : w / 2, y: c ? c.y : h / 2 };
        });

        if (isOceanAdventure) {
            html += renderOceanTrailStars(geo, mainNodes);
        } else if (positions.length > 1) {
            const trailD = buildFlexibleTrail(positions);
            if (trailD) {
                html += '<path class="trail" d="' + trailD + '"/>';
            }
        }

        const largeNodes = isOceanAdventure;
        for (const p of positions) {
            const cls = nodeStatusClass(p.node, currentData);
            const stars = nodeStars(currentData.id, p.node.id);
            html += renderMapNode(p, cls, stars, largeNodes);
        }
        mapSvg.innerHTML = html;
        const mapScroll = document.getElementById("map-scroll");
        mapScroll.classList.toggle("ocean-adventure", !!isOceanAdventure);
        renderMapBonusButtons();

        mapSvg.querySelectorAll(".map-node").forEach(g => {
            const onTap = (e) => {
                e.preventDefault();
                e.stopPropagation();
                const id = g.getAttribute("data-id");
                const node = currentData.nodes.find(n => n.id === id);
                if (!node) return;
                if (!canUnlockNode(node, currentData)) {
                    showLockedMessage(node, currentData);
                    audio.wrong();
                    return;
                }
                startNode(node);
            };
            g.addEventListener("click", onTap);
        });

        const current = currentData.nodes.find(n => nodeStatusClass(n, currentData) === "current");
        if (current) {
            const c = getNodeCenter(geo, current);
            if (c) {
                document.getElementById("map-scroll").scrollTop = Math.max(0, c.y - 120);
            }
        }
    }

    function startNode(node) {
        audio.select();
        currentNode = node;
        session = {
            correct: 0, wrong: 0, combo: 0, comboMax: 0, coinsEarned: 0, roundIndex: 0,
            puzzleMoves: 0, puzzleHint: false,
            roundCleanup: null,
        };
        save.lastPlayed = { continentId: currentData.id, nodeId: node.id };
        saveSave();
        showScreen(gameScreen);
        renderRound();
    }

    function renderRoundDots() {
        roundDots.innerHTML = "";
        const total = currentNode.rounds.length;
        for (let i = 0; i < total; i++) {
            const d = document.createElement("span");
            d.className = "dot";
            if (i < session.roundIndex) d.classList.add("done");
            if (i === session.roundIndex) d.classList.add("current");
            roundDots.appendChild(d);
        }
        const round = currentNode.rounds[session.roundIndex];
        if (round && round.type === "puzzle") {
            gameLocation.textContent = currentNode.title + " · бонус";
        } else {
            gameLocation.textContent = currentNode.title + " · " + (session.roundIndex + 1) + "/" + total;
        }
    }

    const mapCacheLoaded = {};

    function buildExplanationMedia(media) {
        const wrap = document.createElement("div");
        wrap.className = "explanation-media";
        if (media.image) {
            const link = document.createElement("a");
            link.href = media.wikiUrl || "#";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "explanation-media-link";
            link.title = "Відкрити у Вікіпедії";
            const img = document.createElement("img");
            img.src = media.image;
            img.alt = media.caption || "";
            img.loading = "lazy";
            img.onerror = function () {
                link.remove();
            };
            link.appendChild(img);
            wrap.appendChild(link);
        }
        if (media.caption) {
            const cap = document.createElement("p");
            cap.className = "explanation-media-caption";
            if (media.wikiUrl) {
                const a = document.createElement("a");
                a.href = media.wikiUrl;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.textContent = media.caption + " · Вікіпедія →";
                cap.appendChild(a);
            } else {
                cap.textContent = media.caption;
            }
            wrap.appendChild(cap);
        }
        return wrap;
    }

    function showFeedbackModal(round, ok) {
        document.getElementById("feedback-title").textContent = ok ? "✓ Правильно!" : "Ось пояснення";
        const textEl = document.getElementById("feedback-text");
        textEl.innerHTML = "";
        if (round.explanation) {
            const p = document.createElement("p");
            p.className = "feedback-explanation";
            p.textContent = round.explanation;
            textEl.appendChild(p);
        }
        if (round.explanationMedia && round.explanationMedia.image) {
            textEl.appendChild(buildExplanationMedia(round.explanationMedia));
        } else if (round.explanationMedia && round.explanationMedia.wikiUrl) {
            textEl.appendChild(buildExplanationMedia(round.explanationMedia));
        } else if (round.wikiUrl) {
            const p = document.createElement("p");
            p.className = "explanation-media-caption";
            const a = document.createElement("a");
            a.href = round.wikiUrl;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = "Дізнатися більше · Вікіпедія →";
            p.appendChild(a);
            textEl.appendChild(p);
        }
        document.getElementById("modal-feedback").classList.add("active");
    }

    const renderers = {
        quiz(ctx, round) {

            gameMedia.innerHTML = round.media || "";
            gameAnswers.className = "answers grid";
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
