                btn.className = "answer-btn";
                btn.textContent = opt.text;
                btn.addEventListener("click", () => submitAnswer(opt.isCorrect, round, btn));
                gameAnswers.appendChild(btn);
            });
        },
        yesno(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = round.media || "";
            gameAnswers.className = "answers yesno";
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
            choices.forEach((opt) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "answer-btn";
                btn.textContent = opt.label;
                btn.addEventListener("click", () => submitAnswer(opt.value === round.correct, round, btn));
                gameAnswers.appendChild(btn);

        capital(ctx, round) {
            renderers.quiz(ctx, round);
        },
        imageQuiz(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = round.media || "";
            const fitContain = round.imageFit === "contain";
            gameAnswers.className = "answers image-grid" +
                (fitContain ? " fit-contain" : "");
            gameAnswers.innerHTML = "";
            const choices = session.currentChoices || [];
            choices.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "answer-img-btn no-labels";
                const img = document.createElement("img");
                img.src = opt.image;
                img.alt = "Варіант " + (i + 1);
                img.loading = "lazy";
                img.onerror = function () {
                    btn.disabled = true;
                    btn.classList.add("img-missing");
                    img.style.display = "none";
                };
                btn.appendChild(img);
                btn.addEventListener("click", () => submitAnswer(opt.isCorrect, round, btn));
                gameAnswers.appendChild(btn);
            });
        },
        async matchPairs(ctx, round) {
            gamePrompt.textContent = round.text || "З'єднай пари";
            gameMedia.innerHTML = "";
            gameAnswers.className = "answers match-wrap";
            gameAnswers.innerHTML = "";
            mentorBubble.textContent = "🧭 Обери країну зліва і відповідність справа.";

            const pairs = buildMatchRoundPairs(round);
            if (!pairs.left.length || !pairs.right.length) {
                gameAnswers.innerHTML = "<p class='match-hint'>Немає даних для раунду.</p>";
                return;
            }
            if (round.pairKind === "coat") {
                await hydrateCoatImages(pairs.right);
            }
            const graphicalRound = GRAPHICAL_PAIR_KINDS.has(round.pairKind);

            const hint = document.createElement("p");
            hint.className = "match-hint";
            hint.textContent = "Збери " + pairs.left.length + " правильних відповідностей.";
            const board = document.createElement("div");
            board.className = "match-board";
            const lines = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            lines.setAttribute("class", "match-lines");
            const leftCol = document.createElement("div");
            leftCol.className = "match-col";
            const rightCol = document.createElement("div");
            rightCol.className = "match-col" + (graphicalRound ? " tiles" : "");
            board.appendChild(lines);
            board.appendChild(leftCol);
            board.appendChild(rightCol);
            gameAnswers.appendChild(hint);
            gameAnswers.appendChild(board);

            const matchLeftToRight = new Array(pairs.left.length).fill(-1);
            const matchRightToLeft = new Array(pairs.right.length).fill(-1);
            const matchLineColors = new Array(pairs.left.length).fill("");
            let selectedLeft = -1;
            let selectedRight = -1;
            const leftBtns = [];
            const rightBtns = [];

            function makeItem(content, side) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "match-item " + side;
                if (graphicalRound && side === "right") btn.classList.add("image-tile");
                if (content.image) {
                    const img = document.createElement("img");
                    img.className = "match-photo" + (content.imageKind === "flag" ? " flag" : "");
                    img.src = content.image;
                    img.alt = content.text || "зображення";
                    img.loading = "lazy";
                    img.referrerPolicy = "no-referrer";
                    img.onerror = function () {
                        img.remove();
                        if (!btn.querySelector(".ico")) {
                            const fallback = document.createElement("span");
                            fallback.className = "ico";
                            fallback.textContent = content.icon || "🖼️";
                            btn.prepend(fallback);
                        }
                    };
                    btn.appendChild(img);
                }
                const ico = document.createElement("span");
                ico.className = "ico";
                ico.textContent = content.icon || "•";
                if (content.image) {
                    ico.style.display = "none";
                }
                const txt = document.createElement("span");
                txt.className = "txt";
                txt.textContent = content.text;
                btn.appendChild(ico);
                btn.appendChild(txt);
                return btn;
            }

            function pointAt(el, side) {
                const br = board.getBoundingClientRect();
                const r = el.getBoundingClientRect();
                return {
                    x: side === "left" ? (r.right - br.left) : (r.left - br.left),
                    y: r.top - br.top + r.height / 2
                };
            }

            function drawLines() {
                lines.innerHTML = "";
                lines.setAttribute("viewBox", "0 0 " + board.clientWidth + " " + board.clientHeight);
                for (let i = 0; i < matchLeftToRight.length; i++) {
                    const j = matchLeftToRight[i];
                    if (j < 0) continue;
                    const a = pointAt(leftBtns[i], "left");
                    const b = pointAt(rightBtns[j], "right");
                    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                    const cx = (a.x + b.x) / 2;
                    path.setAttribute("d", "M" + a.x + " " + a.y + " C " + cx + " " + a.y + ", " + cx + " " + b.y + ", " + b.x + " " + b.y);
                    path.setAttribute("stroke", matchLineColors[i] || "#22c55e");
                    path.setAttribute("stroke-width", "3");
                    path.setAttribute("fill", "none");
                    path.setAttribute("stroke-linecap", "round");
                    lines.appendChild(path);
                }
            }

            function rerenderStates() {
                leftBtns.forEach((btn, i) => {
                    btn.classList.toggle("selected", i === selectedLeft);
                    btn.classList.toggle("matched", matchLeftToRight[i] >= 0);
                    btn.disabled = answering || matchLeftToRight[i] >= 0;
                });
                rightBtns.forEach((btn, i) => {
                    btn.classList.toggle("selected", i === selectedRight);
                    btn.classList.toggle("matched", matchRightToLeft[i] >= 0);
                    btn.disabled = answering || matchRightToLeft[i] >= 0;
                });
                drawLines();
            }

            function flashMismatch(a, b) {
                a.classList.add("mismatch");
                b.classList.add("mismatch");
                setTimeout(() => {
                    a.classList.remove("mismatch");
                    b.classList.remove("mismatch");
                }, 320);
            }

            function checkDone() {
                if (matchLeftToRight.every(v => v >= 0)) {
                    submitAnswer(true, round, null);
                }
            }

            function tryPair(li, ri) {
                if (answering) return;
                if (pairs.left[li].id === pairs.right[ri].id) {
                    matchLeftToRight[li] = ri;
                    matchRightToLeft[ri] = li;
                    matchLineColors[li] = MATCH_LINE_COLORS[(li + ri) % MATCH_LINE_COLORS.length];
                    audio.tap();
                    selectedLeft = -1;
                    selectedRight = -1;
                    rerenderStates();
                    checkDone();
                } else {
                    audio.wrong();
                    flashMismatch(leftBtns[li], rightBtns[ri]);
                    selectedLeft = -1;
                    selectedRight = -1;
                    rerenderStates();
                }
            }

            pairs.left.forEach((item, i) => {
                const btn = makeItem(item, "left");
                btn.addEventListener("click", () => {
                    if (matchLeftToRight[i] >= 0 || answering) return;
                    selectedLeft = selectedLeft === i ? -1 : i;
                    if (selectedLeft >= 0 && selectedRight >= 0) tryPair(selectedLeft, selectedRight);
                    rerenderStates();
                });
                leftBtns.push(btn);
                leftCol.appendChild(btn);
            });

            pairs.right.forEach((item, i) => {
                const btn = makeItem(item, "right");
                btn.addEventListener("click", () => {
                    if (matchRightToLeft[i] >= 0 || answering) return;
                    selectedRight = selectedRight === i ? -1 : i;
                    if (selectedLeft >= 0 && selectedRight >= 0) tryPair(selectedLeft, selectedRight);
                    rerenderStates();
                });
                rightBtns.push(btn);
                rightCol.appendChild(btn);
            });

            const onResize = () => drawLines();
            window.addEventListener("resize", onResize);
            session.roundCleanup = () => {
                window.removeEventListener("resize", onResize);
            };
            rerenderStates();
        },
        async puzzle(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = "";
            gameAnswers.className = "answers puzzle-wrap";
            gameAnswers.innerHTML = "<p style='color:#94a3b8;text-align:center'>Завантаження пазла…</p>";
            mentorBubble.textContent = "🧭 Обери першу плитку, потім другу — вони поміняються місцями.";

            const cols = round.cols || 5;
            const rows = round.rows || 4;
            const total = cols * rows;
            let imageUrl;
            let pieceSignatures;
            try {
                imageUrl = await buildEuropePuzzleImage(round.mapId || "europe-countries", {
                    countryId: round.countryId || null,
                });
                pieceSignatures = await buildPieceSignatures(imageUrl, cols, rows);
            } catch (e) {
                console.error(e);
                gameAnswers.innerHTML = "<p>Не вдалося завантажити пазл.</p>";
                return;
            }

            gameAnswers.innerHTML = "";
            const toolbar = document.createElement("div");
            toolbar.className = "puzzle-toolbar";
            const stat = document.createElement("span");
            stat.className = "puzzle-stat";
            stat.textContent = "Ходи: 0";
            const preview = document.createElement("img");
            preview.className = "puzzle-preview";
            preview.src = imageUrl;
            preview.alt = "Підказка: як має виглядати карта";
            preview.hidden = true;
            const hintBtn = document.createElement("button");
            hintBtn.type = "button";
            hintBtn.className = "btn-mini";
            hintBtn.textContent = "Підказка";
            const shuffleBtn = document.createElement("button");
            shuffleBtn.type = "button";
            shuffleBtn.className = "btn-mini";
            shuffleBtn.textContent = "Перемішати";
            toolbar.appendChild(stat);
            toolbar.appendChild(hintBtn);
            toolbar.appendChild(shuffleBtn);

            const board = document.createElement("div");
            board.className = "puzzle-board";
            board.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
            board.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";

            let order = [];
            for (let i = 0; i < total; i++) order.push(i);
            let selected = null;
            session.puzzleMoves = 0;
            session.puzzleHint = false;

            function shuffleOrder() {
                do {
                    order = shuffleArray(order);
                } while (order.every((v, i) => v === i));
                selected = null;
            }
            shuffleOrder();

            function pieceBgPos(pieceIdx) {
                const col = pieceIdx % cols;
                const row = Math.floor(pieceIdx / cols);
                const x = cols > 1 ? (col / (cols - 1)) * 100 : 0;
                const y = rows > 1 ? (row / (rows - 1)) * 100 : 0;
                return x + "% " + y + "%";
            }

            function isSolved() {
                return order.every((pieceIdx, slotIdx) => pieceSignatures[pieceIdx] === pieceSignatures[slotIdx]);
            }

            function onSolved() {
                if (answering) return;
                answering = true;
                session.correct = 1;
                session.wrong = session.puzzleHint || session.puzzleMoves > 55 ? 1 : 0;
                session.combo = 1;
                session.comboMax = 1;
                audio.correct();
                flash("correct");
                confetti(30);
                mentorBubble.textContent = "🧭 Карта Європи зібрана! Чудова робота!";
                setTimeout(() => {
                    if (round.explainOnSuccess || round.explanation) {
                        showFeedbackModal(round, true);
                    } else {
                        finishNode();
                    }
                }, 600);
            }

            function renderBoard() {
                board.innerHTML = "";
                order.forEach((pieceIdx, slotIdx) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "puzzle-piece";
                    if (slotIdx === selected) btn.classList.add("selected");
                    if (pieceSignatures[pieceIdx] === pieceSignatures[slotIdx]) {
                        btn.classList.add("correct-slot");
                    }
                    btn.style.backgroundImage = "url(" + imageUrl + ")";
                    btn.style.backgroundSize = cols * 100 + "% " + rows * 100 + "%";
                    btn.style.backgroundPosition = pieceBgPos(pieceIdx);
                    btn.setAttribute("aria-label", "Плитка " + (slotIdx + 1));
                    btn.addEventListener("click", () => {
                        if (answering) return;
                        if (selected === null) {
                            selected = slotIdx;
                            audio.tap();
                            renderBoard();
                            return;
                        }
                        if (selected === slotIdx) {
                            selected = null;
                            renderBoard();
                            return;
                        }
                        const a = selected;
                        const b = slotIdx;
                        const tmp = order[a];
                        order[a] = order[b];
                        order[b] = tmp;
                        selected = null;
                        session.puzzleMoves++;
                        stat.textContent = "Ходи: " + session.puzzleMoves;
                        audio.tap();
                        renderBoard();
                        if (isSolved()) onSolved();
                    });
                    board.appendChild(btn);
                });
            }

            hintBtn.addEventListener("click", () => {
                audio.tap();
                session.puzzleHint = true;
                preview.hidden = !preview.hidden;
                hintBtn.textContent = preview.hidden ? "Підказка" : "Сховати";
            });
            shuffleBtn.addEventListener("click", () => {
                if (answering) return;
                audio.tap();
                shuffleOrder();
                session.puzzleMoves++;
                stat.textContent = "Ходи: " + session.puzzleMoves;
                renderBoard();
            });

            gameAnswers.appendChild(toolbar);
            gameAnswers.appendChild(preview);
            gameAnswers.appendChild(board);
            renderBoard();
        },
        async mapTap(ctx, round) {
            gamePrompt.textContent = round.text;
            gameMedia.innerHTML = "";
            gameAnswers.className = "answers";
            gameAnswers.innerHTML = "<p style='text-align:center;color:#94a3b8'>Натисни країну на карті</p>";
            const mapData = await loadMap(round.mapId || "europe-simple");
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", mapData.viewBox || "0 0 400 360");
            svg.setAttribute("class", "map-tap-svg");
            for (const c of mapData.countries) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", c.path);
                path.setAttribute("data-id", c.id);
                if (c.id === round.targetCountryId) path.classList.add("highlight");
                path.addEventListener("click", () => {
                    if (answering) return;
                    const ok = c.id === round.targetCountryId;
                    if (!ok) path.setAttribute("fill", "rgba(239,68,68,0.5)");
                    submitAnswer(ok, round, path);
                });
                svg.appendChild(path);
            }
            gameMedia.innerHTML = "";
            gameMedia.appendChild(svg);
        }
    };

    function renderRound() {
        if (session && typeof session.roundCleanup === "function") {
            try { session.roundCleanup(); } catch (_) {}
            session.roundCleanup = null;
        }
        answering = false;
        const round = currentNode.rounds[session.roundIndex];
        session.currentChoices = prepareRoundChoices(round);
        renderRoundDots();
        mentorBubble.textContent = "🧭 " + randomPick(PRAISE);
        voice.speak(round.text);
        const fn = renderers[round.type];
        if (!fn) {
            gamePrompt.textContent = "Невідомий тип: " + round.type;
            return;
        }
        Promise.resolve(fn(null, round)).catch(console.error);
    }

    function awardCoins(amount, round) {
        let add = amount;
        if (session.combo >= 3) {
            add *= 2;
            showComboBanner("Комбо x2! +" + add + " 🪙");
        }
        if (round.boss) add *= 2;
        session.coinsEarned += add;
        save.coins += add;
        audio.coin();
        updateHud("coins");
    }

    function submitAnswer(ok, round, el) {
        if (answering) return;
        answering = true;
        [...gameAnswers.querySelectorAll(".answer-btn, .answer-img-btn")].forEach(b => {
            b.disabled = true;
        });

        if (ok) {
            if (el && el.classList) el.classList.add("correct");
            session.correct++;
            session.combo++;
            session.comboMax = Math.max(session.comboMax, session.combo);
            awardCoins(1, round);
            audio.correct();
            flash("correct");
            mentorBubble.textContent = "🧭 " + randomPick(PRAISE);
            if (round.explainOnSuccess || round.explanationMedia) {
                showFeedbackModal(round, true);
            } else {
                setTimeout(advanceRound, 600);
            }
        } else {
            if (el && el.classList) el.classList.add("wrong");
            session.wrong++;
            session.combo = 0;
            audio.wrong();
            flash("wrong");
            shake();
            mentorBubble.textContent = "🧭 " + randomPick(ENCOURAGE);
            showFeedbackModal(round, false);
        }
    }

    function advanceRound() {
        if (session && typeof session.roundCleanup === "function") {
            try { session.roundCleanup(); } catch (_) {}
            session.roundCleanup = null;
        }
        document.getElementById("modal-feedback").classList.remove("active");
        session.roundIndex++;
        if (session.roundIndex >= currentNode.rounds.length) {
            finishNode();
        } else {
            renderRound();
        }
    }

    document.getElementById("feedback-next").addEventListener("click", () => {
        audio.tap();
        const round = currentNode && currentNode.rounds[session.roundIndex];
        if (round && round.type === "puzzle" && answering) {
            document.getElementById("modal-feedback").classList.remove("active");
            finishNode();
            return;
        }
        advanceRound();
    });

    function finishNode() {
        if (session && typeof session.roundCleanup === "function") {
            try { session.roundCleanup(); } catch (_) {}
            session.roundCleanup = null;
        }
        const total = currentNode.rounds.length;
        const stars = starsForSession(session.correct, total, session.wrong, session.comboMax);
        const cs = continentSave(currentData.id);
        const prev = cs.nodes[currentNode.id]?.stars || 0;
        if (stars > prev) cs.nodes[currentNode.id] = { stars, bestCombo: session.comboMax };
        else if (cs.nodes[currentNode.id]) {
            cs.nodes[currentNode.id].bestCombo = Math.max(cs.nodes[currentNode.id].bestCombo || 0, session.comboMax);
        } else {
            cs.nodes[currentNode.id] = { stars, bestCombo: session.comboMax };
        }
        if (stars === 3) {
            save.coins += 3;
            session.coinsEarned += 3;
        }
        save.comboBest = Math.max(save.comboBest, session.comboMax);
        recalcTotalStars();
        saveSave();
        updateHud("stars");

        const titles = ["Спробуй ще!", "Непогано!", "Молодець!", "Ідеально!"];
        document.getElementById("result-title").textContent = titles[stars] || "Готово";
        document.getElementById("result-stars").textContent = stars > 0 ? "⭐".repeat(stars) : "—";
        document.getElementById("result-coins").textContent = "+" + session.coinsEarned + " монет";
        document.getElementById("modal-result").classList.add("active");
        if (stars >= 2) {
            audio.win();
            confetti(stars === 3 ? 40 : 20);
            flash("win");
        } else {
            audio.star();
        }

        if (stars >= 3 && currentData.id === "europe" &&
            currentData.nodes.filter(n => !n.bonus).every(n => nodeStars("europe", n.id) >= 3)) {
            if (!save.badges.includes("europe-complete")) {
                save.badges.push("europe-complete");
                saveSave();
                setTimeout(() => toast("Бейдж: Європа завершена! 🏅"), 800);
            }
        }
    }

    document.getElementById("result-next").addEventListener("click", () => {
        audio.tap();
        document.getElementById("modal-result").classList.remove("active");
        renderMap().then(() => {
            renderOrbitRing();
            showScreen(mapScreen);
        });
    });

    document.querySelectorAll("[data-close]").forEach(btn => {
        btn.addEventListener("click", () => {
            audio.tap();
            btn.closest(".modal-backdrop").classList.remove("active");
        });
    });

    document.getElementById("map-back").addEventListener("click", () => {
        audio.tap();
        globe.resetView();
        renderOrbitRing();
        showScreen(hubScreen);
    });

    function resumeProgress() {
        const lp = save.lastPlayed;
        if (lp?.continentId) {
            const meta = getRegionList().find(r => r.id === lp.continentId);
            if (meta && !isComingSoon(meta)) {
                beginRegionFlight(meta).then(() => {
                    if (lp.nodeId && currentData) {
                        const node = currentData.nodes.find(n => n.id === lp.nodeId);
                        if (node && canUnlockNode(node, currentData)) startNode(node);
                    }
                });
                return;
            }
        }
        const europe = getRegionList().find(r => r.id === "europe");
        if (europe) beginRegionFlight(europe);
    }

    document.getElementById("btn-resume").addEventListener("click", () => {
        audio.tap();
        resumeProgress();
    });

    async function init() {
        updateHud();
        try {
            await loadWorld();
            await Promise.all([
                loadContinentData(world.continents.find(c => c.id === "europe")),
                loadContinentData(world.ocean),
                globe.loadTexture()
            ]);
            renderOrbitRing();
            if (save.lastPlayed?.continentId && REGION_GEO_CENTERS[save.lastPlayed.continentId]) {
                const c = REGION_GEO_CENTERS[save.lastPlayed.continentId];
                globe.setGeoCenter(c.lat, c.lon);
            }
        } catch (err) {
            console.error(err);
            toast("Не вдалося завантажити дані");
        }
    }

    init();

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("../../sw.js").catch(() => {});
        });
    }
})();
</script>
