<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
    <title>Maze Game</title>

    <link rel="manifest" href="../../manifest.webmanifest" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Лабіринт" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="../../icon.svg" />
    <link rel="apple-touch-icon" href="../../icon.svg" />

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { overscroll-behavior: none; }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 12px 24px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .back-link {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .back-link:active { background: rgba(255, 255, 255, 0.14); }

        .difficulty {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 2px;
            gap: 2px;
        }

        .diff-btn {
            background: transparent;
            border: 0;
            color: #cbd5e1;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-family: inherit;
        }

        .diff-btn.active {
            background: rgba(255, 255, 255, 0.14);
            color: white;
            font-weight: 600;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1.05rem;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s;
        }

        .icon-btn:active { background: rgba(255, 255, 255, 0.18); }

        .icon-btn.lang {
            width: auto;
            padding: 0 12px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #fde68a;
        }

        .top-right-group {
            display: inline-flex;
            gap: 6px;
        }

        #hud {
            width: 100%;
            max-width: 480px;
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .stat {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 12px;
            text-align: center;
        }

        .stat-label {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .stat-value {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            font-variant-numeric: tabular-nums;
        }

        .stat.best .stat-value { color: #fde68a; }

        #board {
            margin-top: 14px;
            width: var(--board-size, 320px);
            height: var(--board-size, 320px);
            position: relative;
            border-radius: 18px;
            padding: 8px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.02));
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.3s;
        }

        #board.shake { animation: board-shake 0.32s; }

        @keyframes board-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        #board.glow {
            box-shadow: 0 12px 50px rgba(34, 197, 94, 0.45),
                        0 0 0 2px rgba(74, 222, 128, 0.6) inset,
                        0 0 60px rgba(34, 197, 94, 0.35);
        }

        #game.fade-in { animation: fade-in 0.45s ease-out; }

        @keyframes fade-in {
            from { opacity: 0; transform: scale(0.94); }
            to   { opacity: 1; transform: scale(1); }
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            background: #0b1430;
            border-radius: 12px;
            overflow: hidden;
            touch-action: none;
        }

        #player, #goal {
            position: absolute;
            width: var(--piece-size, 16px);
            height: var(--piece-size, 16px);
            border-radius: 50%;
            transition: left 0.09s ease-out, top 0.09s ease-out;
        }

        #player {
            background: radial-gradient(circle at 30% 30%, #ffb4b4, #ef4444 55%, #b91c1c);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.75), 0 2px 6px rgba(0, 0, 0, 0.4);
            z-index: 3;
        }

        #goal {
            background: radial-gradient(circle at 30% 30%, #c8f7d5, #22c55e 55%, #15803d);
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.7);
            animation: pulse 1.6s infinite ease-in-out;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
            50% { transform: scale(1.18); box-shadow: 0 0 20px rgba(34, 197, 94, 0.95); }
        }

        .wall {
            position: absolute;
            background: rgba(226, 232, 240, 0.85);
            border-radius: 1px;
            transition: background 0.25s, box-shadow 0.25s;
        }

        .wall.hit {
            background: #f87171;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.9);
        }

        .trail {
            position: absolute;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.22);
            pointer-events: none;
            z-index: 1;
            animation: trail-pop 0.28s ease-out;
        }

        @keyframes trail-pop {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        #goal.burst {
            animation: goal-burst 0.9s ease-out forwards;
        }

        @keyframes goal-burst {
            0%   { transform: scale(1); box-shadow: 0 0 14px rgba(34, 197, 94, 0.7); }
            40%  { transform: scale(2.4); box-shadow: 0 0 60px rgba(74, 222, 128, 1); }
            100% { transform: scale(0); opacity: 0; box-shadow: 0 0 100px rgba(74, 222, 128, 0); }
        }

        .controls {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(3, minmax(60px, 76px));
            grid-template-rows: repeat(3, minmax(60px, 76px));
            gap: 8px;
        }

        .ctrl {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            color: white;
            font-size: 1.7rem;
            line-height: 1;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.1s, transform 0.06s;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
        }

        .ctrl:active, .ctrl.pressed {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(0.94);
        }

        #up    { grid-column: 2; grid-row: 1; }
        #left  { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down  { grid-column: 2; grid-row: 3; }

        .actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: inherit;
        }

        .action-btn:active { background: rgba(255, 255, 255, 0.18); }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .overlay.active { display: flex; }

        .modal {
            background: linear-gradient(180deg, #1e3a8a 0%, #1a1a2e 100%);
            border: 2px solid rgba(255, 215, 0, 0.55);
            border-radius: 18px;
            padding: 24px 22px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: pop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }

        @keyframes pop {
            from { transform: scale(0.8); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }

        .modal h2 {
            margin: 0 0 4px;
            font-size: 1.5rem;
            color: #ffe066;
        }

        .modal .sub {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin: 0 0 16px;
        }

        .modal-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .modal-stat {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px;
        }

        .modal-stat .l {
            font-size: 0.68rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .modal-stat .v {
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        .new-best {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255, 215, 0, 0.18);
            color: #fde68a;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: 0;
            font-family: inherit;
        }

        .btn-primary {
            background: #ffd700;
            color: #1a1a2e;
        }

        .btn-primary:active { background: #f5c800; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 360px) {
            .controls {
                grid-template-columns: repeat(3, 58px);
                grid-template-rows: repeat(3, 58px);
            }
            .ctrl { font-size: 1.4rem; border-radius: 14px; }
        }

        .flash {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: transparent;
            z-index: 40;
            transition: background 0.25s ease;
        }

        .flash.win  { background: rgba(251, 191, 36, 0.28); }
        .flash.bump { background: rgba(239, 68, 68, 0.18); }

        .confetti {
            position: fixed;
            top: -40px;
            pointer-events: none;
            z-index: 110;
            animation: fall linear forwards;
            will-change: transform, opacity;
        }

        @keyframes fall {
            to { transform: translateY(115vh) rotate(720deg); opacity: 0.15; }
        }
    </style>
</head>

<body>

<div class="top-bar">
    <a class="back-link" href="../../index.html" data-i18n="backMenu">← Меню</a>
    <div class="difficulty" id="difficulty">
        <button class="diff-btn" data-size="8" data-i18n="diffEasy" type="button">Легко</button>
        <button class="diff-btn active" data-size="12" data-i18n="diffMedium" type="button">Середньо</button>
        <button class="diff-btn" data-size="16" data-i18n="diffHard" type="button">Складно</button>
    </div>
    <div class="top-right-group">
        <button id="lang-toggle" class="icon-btn lang" type="button" aria-label="Мова">UA</button>
        <button id="sound-toggle" class="icon-btn" aria-label="Звук" type="button">🔊</button>
    </div>
</div>

<div id="hud">
    <div class="stat">
        <span class="stat-label" data-i18n="statTime">Час</span>
        <span class="stat-value" id="time">0с</span>
    </div>
    <div class="stat">
        <span class="stat-label" data-i18n="statSteps">Кроки</span>
        <span class="stat-value" id="steps">0</span>
    </div>
    <div class="stat best">
        <span class="stat-label" data-i18n="statBest">Рекорд</span>
        <span class="stat-value" id="bestTime">—</span>
    </div>
</div>

<div id="board">
    <div id="game">
        <div id="player"></div>
        <div id="goal"></div>
    </div>
</div>

<div class="controls">
    <button id="up" class="ctrl" aria-label="Up" type="button">↑</button>
    <button id="left" class="ctrl" aria-label="Left" type="button">←</button>
    <button id="right" class="ctrl" aria-label="Right" type="button">→</button>
    <button id="down" class="ctrl" aria-label="Down" type="button">↓</button>
</div>

<div class="actions">
    <button id="restart" class="action-btn" data-i18n="restartBtn" type="button">↻ Новий лабіринт</button>
</div>

<div id="flash" class="flash"></div>

<div id="winOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="modal">
        <h2 id="winTitle" data-i18n="winTitle">🎉 Перемога!</h2>
        <p class="sub" id="winMessage">Лабіринт пройдено.</p>
        <div id="newBestRow"></div>
        <div class="modal-stats">
            <div class="modal-stat">
                <div class="l" data-i18n="statTime">Час</div>
                <div class="v" id="winTime">0с</div>
            </div>
            <div class="modal-stat">
                <div class="l" data-i18n="statSteps">Кроки</div>
                <div class="v" id="winSteps">0</div>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-primary" id="winNext" data-i18n="winPlayAgain" type="button">Грати знову →</button>
        </div>
    </div>
</div>

<script>
    const board = document.getElementById("board");
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const goal = document.getElementById("goal");
    const timeEl = document.getElementById("time");
    const stepsEl = document.getElementById("steps");
    const bestTimeEl = document.getElementById("bestTime");
    const difficultyEl = document.getElementById("difficulty");
    const restartBtn = document.getElementById("restart");
    const winOverlay = document.getElementById("winOverlay");
    const winTime = document.getElementById("winTime");
    const winSteps = document.getElementById("winSteps");
    const winMessage = document.getElementById("winMessage");
    const winNext = document.getElementById("winNext");
    const newBestRow = document.getElementById("newBestRow");
    const flashEl = document.getElementById("flash");
    const soundToggle = document.getElementById("sound-toggle");
    const langToggle  = document.getElementById("lang-toggle");

    /* -------------------- i18n -------------------- */
    const I18N = {
        uk: {
            title:        "Лабіринт",
            backMenu:     "← Меню",
            diffEasy:     "Легко",
            diffMedium:   "Середньо",
            diffHard:     "Складно",
            statTime:     "Час",
            statSteps:    "Кроки",
            statBest:     "Рекорд",
            secSuffix:    "с",
            restartBtn:   "↻ Новий лабіринт",
            winTitle:     "🎉 Перемога!",
            winMessage:   "Лабіринт пройдено!",
            winNewBest:   "★ Новий рекорд!",
            winPlayAgain: "Грати знову →",
            ariaSound:    "Звук",
            ariaLang:     "Мова"
        },
        en: {
            title:        "Maze",
            backMenu:     "← Menu",
            diffEasy:     "Easy",
            diffMedium:   "Medium",
            diffHard:     "Hard",
            statTime:     "Time",
            statSteps:    "Steps",
            statBest:     "Best",
            secSuffix:    "s",
            restartBtn:   "↻ New maze",
            winTitle:     "🎉 You made it!",
            winMessage:   "Maze solved!",
            winNewBest:   "★ New best time!",
            winPlayAgain: "Play again →",
            ariaSound:    "Sound",
            ariaLang:     "Language"
        }
    };

    let lang = localStorage.getItem("maze.lang");
    if (lang !== "uk" && lang !== "en") lang = "uk";
    const tr = (key) => (I18N[lang] && I18N[lang][key]) || I18N.uk[key] || key;

    let lastWinState = null;

    function applyLang() {
        document.documentElement.lang = lang;
        document.title = tr("title");

        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            const val = tr(key);
            if (val) el.textContent = val;
        });

        soundToggle.setAttribute("aria-label", tr("ariaSound"));
        langToggle.setAttribute("aria-label", tr("ariaLang"));
        langToggle.textContent = lang === "uk" ? "UA" : "EN";

        // Time / best labels depend on suffix.
        bestTimeEl.textContent = bestTime === null ? "—" : bestTime + tr("secSuffix");
        if (startTime) timeEl.textContent = elapsed + tr("secSuffix");
        else timeEl.textContent = "0" + tr("secSuffix");

        // If the win modal is currently shown, refresh its dynamic strings too.
        if (lastWinState) {
            winTime.textContent  = lastWinState.seconds + tr("secSuffix");
            winSteps.textContent = String(lastWinState.steps);
            winMessage.textContent = tr("winMessage");
            newBestRow.innerHTML = lastWinState.isBest
                ? '<span class="new-best">' + tr("winNewBest") + "</span>"
                : "";
        }
    }

    langToggle.addEventListener("click", () => {
        lang = lang === "uk" ? "en" : "uk";
        localStorage.setItem("maze.lang", lang);
        audio.tick();
        applyLang();
    });

    /* -------------------- AUDIO (Web Audio synth) -------------------- */
    const audio = (() => {
        let ctx = null;
        let muted = localStorage.getItem("maze.muted") === "1";

        function ensure() {
            if (!ctx) {
                const C = window.AudioContext || window.webkitAudioContext;
                if (!C) return null;
                ctx = new C();
            }
            if (ctx.state === "suspended") ctx.resume();
            return ctx;
        }

        function tone(freq, dur, type = "sine", gain = 0.1, when = 0) {
            if (muted) return;
            const c = ensure();
            if (!c) return;
            const t0 = c.currentTime + when;
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            g.gain.setValueAtTime(0, t0);
            g.gain.linearRampToValueAtTime(gain, t0 + 0.008);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(g).connect(c.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }

        function noise(dur, gain = 0.04, when = 0, freq = 800) {
            if (muted) return;
            const c = ensure();
            if (!c) return;
            const t0 = c.currentTime + when;
            const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
            const src = c.createBufferSource();
            src.buffer = buf;
            const filter = c.createBiquadFilter();
            filter.type = "bandpass";
            filter.frequency.value = freq;
            const g = c.createGain();
            g.gain.setValueAtTime(gain, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            src.connect(filter).connect(g).connect(c.destination);
            src.start(t0);
        }

        return {
            step:      () => tone(580 + Math.random() * 80, 0.04, "triangle", 0.04),
            discover:  () => { tone(880, 0.08, "sine", 0.08); tone(1320, 0.1, "sine", 0.06, 0.03); },
            bump:      () => { tone(110, 0.18, "sawtooth", 0.1); noise(0.12, 0.05, 0, 400); },
            regenerate: () => noise(0.35, 0.06, 0, 1200),
            win: () => {
                [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) =>
                    tone(f, 0.28, "triangle", 0.13, i * 0.1));
            },
            newBest: () => {
                [2093, 2637, 3136].forEach((f, i) => tone(f, 0.32, "sine", 0.08, 0.7 + i * 0.12));
            },
            tick:      () => tone(880, 0.04, "square", 0.05),
            isMuted:   () => muted,
            toggle:    () => {
                muted = !muted;
                localStorage.setItem("maze.muted", muted ? "1" : "0");
                if (!muted) { ensure(); tone(880, 0.05, "triangle", 0.07); }
                return muted;
            }
        };
    })();

    function updateSoundIcon() {
        soundToggle.textContent = audio.isMuted() ? "🔇" : "🔊";
    }
    updateSoundIcon();
    soundToggle.addEventListener("click", () => { audio.toggle(); updateSoundIcon(); });

    /* -------------------- Visual fx helpers -------------------- */
    function flash(kind, ms = 280) {
        flashEl.classList.remove("win", "bump");
        void flashEl.offsetWidth;
        flashEl.classList.add(kind);
        setTimeout(() => flashEl.classList.remove(kind), ms);
    }

    function shakeBoard() {
        board.classList.remove("shake");
        void board.offsetWidth;
        board.classList.add("shake");
        setTimeout(() => board.classList.remove("shake"), 350);
    }

    const CONFETTI_EMOJIS = ["🎉", "🎊", "✨", "⭐", "🏆", "🌟"];
    function confetti(count) {
        for (let i = 0; i < count; i++) {
            const el = document.createElement("span");
            el.className = "confetti";
            el.textContent = CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)];
            el.style.left = (Math.random() * 100) + "vw";
            el.style.fontSize = (16 + Math.random() * 20) + "px";
            el.style.animationDelay = (Math.random() * 0.4) + "s";
            el.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3800);
        }
    }

    /* The wall edge that the player tried to cross (briefly highlighted red). */
    function flashWall(fromX, fromY, dirX, dirY) {
        const thick = Math.max(2, Math.round(cellSize * 0.08));
        const px = fromX * cellSize;
        const py = fromY * cellSize;
        let x1, y1, w, h;
        if (dirX === 1)       { x1 = px + cellSize - thick; y1 = py;                 w = thick;    h = cellSize; }
        else if (dirX === -1) { x1 = px;                    y1 = py;                 w = thick;    h = cellSize; }
        else if (dirY === 1)  { x1 = px;                    y1 = py + cellSize - thick; w = cellSize; h = thick;    }
        else                  { x1 = px;                    y1 = py;                 w = cellSize; h = thick;    }

        const walls = game.querySelectorAll(".wall");
        let hit = null;
        for (const w0 of walls) {
            const wx = parseFloat(w0.style.left);
            const wy = parseFloat(w0.style.top);
            if (Math.abs(wx - x1) < 1.5 && Math.abs(wy - y1) < 1.5) { hit = w0; break; }
        }
        if (!hit) return;
        hit.classList.add("hit");
        setTimeout(() => hit.classList.remove("hit"), 260);
    }

    let size = 12;
    let cellSize = 24;
    let pieceSize = 14;
    let pieceOffset = 5;

    let grid = [];
    let visited = new Set();
    let x = 0, y = 0;
    let steps = 0;
    let locked = false;
    let startTime = 0;
    let elapsed = 0;
    let timer = null;
    let bestTime = null;

    function bestKey() { return "maze.best." + size; }

    function loadBest() {
        const raw = localStorage.getItem(bestKey());
        bestTime = raw === null ? null : Number(raw);
        bestTimeEl.textContent = bestTime === null ? "—" : bestTime + tr("secSuffix");
    }

    function saveBest(t) {
        if (bestTime === null || t < bestTime) {
            bestTime = t;
            localStorage.setItem(bestKey(), String(t));
            bestTimeEl.textContent = t + tr("secSuffix");
            return true;
        }
        return false;
    }

    function computeSizes() {
        const horizontal = Math.min(window.innerWidth - 24, 460);
        const verticalBudget = window.innerHeight - 360;
        const target = Math.max(260, Math.min(horizontal, Math.max(260, verticalBudget), 460));
        const innerSize = target - 16;
        cellSize = Math.floor(innerSize / size);
        const realInner = cellSize * size;
        const boardSize = realInner + 16;

        pieceSize = Math.max(8, Math.round(cellSize * 0.58));
        pieceOffset = Math.round((cellSize - pieceSize) / 2);

        document.documentElement.style.setProperty("--board-size", boardSize + "px");
        document.documentElement.style.setProperty("--piece-size", pieceSize + "px");
    }

    function createGrid() {
        grid = [];
        for (let yy = 0; yy < size; yy++) {
            const row = [];
            for (let xx = 0; xx < size; xx++) {
                row.push({
                    x: xx, y: yy,
                    visited: false,
                    walls: { top: true, right: true, bottom: true, left: true }
                });
            }
            grid.push(row);
        }
    }

    function neighbors(c) {
        const n = [];
        if (c.y > 0)        n.push(grid[c.y - 1][c.x]);
        if (c.y < size - 1) n.push(grid[c.y + 1][c.x]);
        if (c.x > 0)        n.push(grid[c.y][c.x - 1]);
        if (c.x < size - 1) n.push(grid[c.y][c.x + 1]);
        return n.filter(nb => !nb.visited);
    }

    function removeWall(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        if (dx === 1)  { a.walls.left = false;  b.walls.right = false; }
        if (dx === -1) { a.walls.right = false; b.walls.left = false; }
        if (dy === 1)  { a.walls.top = false;   b.walls.bottom = false; }
        if (dy === -1) { a.walls.bottom = false; b.walls.top = false; }
    }

    function generate() {
        createGrid();
        const stack = [];
        let cur = grid[0][0];
        cur.visited = true;
        while (true) {
            const n = neighbors(cur);
            if (n.length) {
                const next = n[Math.floor(Math.random() * n.length)];
                next.visited = true;
                stack.push(cur);
                removeWall(cur, next);
                cur = next;
            } else {
                cur = stack.pop();
                if (!cur) break;
            }
        }
    }

    function wall(px, py, w, h) {
        const d = document.createElement("div");
        d.className = "wall";
        d.style.left = px + "px";
        d.style.top = py + "px";
        d.style.width = w + "px";
        d.style.height = h + "px";
        game.appendChild(d);
    }

    function draw() {
        game.querySelectorAll(".wall, .trail").forEach(w => w.remove());
        const thick = Math.max(2, Math.round(cellSize * 0.08));
        for (let yy = 0; yy < size; yy++) {
            for (let xx = 0; xx < size; xx++) {
                const c = grid[yy][xx];
                const px = xx * cellSize;
                const py = yy * cellSize;
                if (c.walls.top)  wall(px, py, cellSize, thick);
                if (c.walls.left) wall(px, py, thick, cellSize);
            }
        }
        wall(0, size * cellSize - thick, size * cellSize, thick);
        wall(size * cellSize - thick, 0, thick, size * cellSize);
    }

    function placePieces() {
        player.style.left = (x * cellSize + pieceOffset) + "px";
        player.style.top  = (y * cellSize + pieceOffset) + "px";
        goal.style.left = ((size - 1) * cellSize + pieceOffset) + "px";
        goal.style.top  = ((size - 1) * cellSize + pieceOffset) + "px";
    }

    function addTrail(cx, cy) {
        const dotSize = Math.max(4, Math.round(cellSize * 0.22));
        const offset = Math.round((cellSize - dotSize) / 2);
        const d = document.createElement("div");
        d.className = "trail";
        d.style.left = (cx * cellSize + offset) + "px";
        d.style.top  = (cy * cellSize + offset) + "px";
        d.style.width = dotSize + "px";
        d.style.height = dotSize + "px";
        game.appendChild(d);
    }

    function formatElapsed() {
        return Math.floor((Date.now() - startTime) / 1000);
    }

    function startTimer() {
        clearInterval(timer);
        startTime = Date.now();
        elapsed = 0;
        timeEl.textContent = "0" + tr("secSuffix");
        timer = setInterval(() => {
            if (locked) return;
            elapsed = formatElapsed();
            timeEl.textContent = elapsed + tr("secSuffix");
        }, 250);
    }

    function reset() {
        computeSizes();
        generate();
        draw();
        x = 0; y = 0;
        steps = 0;
        visited = new Set(["0,0"]);
        stepsEl.textContent = "0";
        locked = false;
        lastWinState = null;
        timeEl.textContent = "0" + tr("secSuffix");

        goal.classList.remove("burst");
        goal.style.opacity = "";
        board.classList.remove("glow");
        placePieces();

        game.classList.remove("fade-in");
        void game.offsetWidth;
        game.classList.add("fade-in");

        audio.regenerate();
        startTimer();
    }

    function vibrate(ms) {
        if (navigator.vibrate) navigator.vibrate(ms);
    }

    function canMove(nx, ny) {
        if (nx < 0 || ny < 0 || nx >= size || ny >= size) return false;
        const c = grid[y][x];
        if (nx === x + 1 && c.walls.right)  return false;
        if (nx === x - 1 && c.walls.left)   return false;
        if (ny === y + 1 && c.walls.bottom) return false;
        if (ny === y - 1 && c.walls.top)    return false;
        return true;
    }

    function move(dx, dy) {
        if (locked) return false;
        const nx = x + dx;
        const ny = y + dy;
        if (!canMove(nx, ny)) {
            audio.bump();
            shakeBoard();
            flash("bump", 200);
            flashWall(x, y, dx, dy);
            vibrate([12, 30, 12]);
            return false;
        }

        const key = nx + "," + ny;
        const isNewCell = !visited.has(key);
        if (isNewCell) {
            visited.add(key);
            addTrail(x, y);
        }

        x = nx; y = ny;
        steps++;
        stepsEl.textContent = String(steps);
        player.style.left = (x * cellSize + pieceOffset) + "px";
        player.style.top  = (y * cellSize + pieceOffset) + "px";

        if (isNewCell) audio.discover();
        else           audio.step();
        vibrate(6);
        checkWin();
        return true;
    }

    function checkWin() {
        if (x === size - 1 && y === size - 1) {
            locked = true;
            clearInterval(timer);
            const seconds = formatElapsed();
            elapsed = seconds;
            timeEl.textContent = seconds + tr("secSuffix");
            vibrate([15, 60, 15, 60, 25]);

            const isBest = saveBest(seconds);
            lastWinState = { seconds, steps, isBest };

            // Visual: goal explodes, board glows gold, screen flashes, confetti rains.
            goal.classList.add("burst");
            board.classList.add("glow");
            flash("win", 500);
            confetti(isBest ? 70 : 40);

            // Audio: fanfare + optional new-best bell stack.
            audio.win();
            if (isBest) {
                audio.newBest();
                vibrate([30, 80, 30, 80, 30, 80, 80]);
            }

            winTime.textContent  = seconds + tr("secSuffix");
            winSteps.textContent = String(steps);
            winMessage.textContent = tr("winMessage");
            newBestRow.innerHTML = isBest
                ? '<span class="new-best">' + tr("winNewBest") + "</span>"
                : "";

            setTimeout(() => winOverlay.classList.add("active"), 850);
        }
    }

    function holdControl(btn, dx, dy) {
        let interval = null;
        const start = (e) => {
            if (e) e.preventDefault();
            if (locked) return;
            btn.classList.add("pressed");
            move(dx, dy);
            clearInterval(interval);
            interval = setInterval(() => move(dx, dy), 110);
        };
        const stop = () => {
            btn.classList.remove("pressed");
            clearInterval(interval);
            interval = null;
        };
        btn.addEventListener("pointerdown", start);
        btn.addEventListener("pointerup", stop);
        btn.addEventListener("pointerleave", stop);
        btn.addEventListener("pointercancel", stop);
    }

    holdControl(document.getElementById("up"), 0, -1);
    holdControl(document.getElementById("down"), 0, 1);
    holdControl(document.getElementById("left"), -1, 0);
    holdControl(document.getElementById("right"), 1, 0);

    let swipeStart = null;
    const SWIPE_THRESHOLD = 22;

    game.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 1) return;
        swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });

    game.addEventListener("touchmove", (e) => {
        if (!swipeStart || e.touches.length !== 1) return;
        const t = e.touches[0];
        const dx = t.clientX - swipeStart.x;
        const dy = t.clientY - swipeStart.y;
        if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) return;

        if (Math.abs(dx) > Math.abs(dy)) {
            move(dx > 0 ? 1 : -1, 0);
        } else {
            move(0, dy > 0 ? 1 : -1);
        }
        swipeStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });

    game.addEventListener("touchend", () => { swipeStart = null; });
    game.addEventListener("touchcancel", () => { swipeStart = null; });

    document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowUp")    { e.preventDefault(); move(0, -1); }
        if (e.key === "ArrowDown")  { e.preventDefault(); move(0, 1); }
        if (e.key === "ArrowLeft")  { e.preventDefault(); move(-1, 0); }
        if (e.key === "ArrowRight") { e.preventDefault(); move(1, 0); }
    });

    difficultyEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".diff-btn");
        if (!btn) return;
        const newSize = Number(btn.dataset.size);
        if (newSize === size) return;
        difficultyEl.querySelectorAll(".diff-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        size = newSize;
        loadBest();
        audio.tick();
        winOverlay.classList.remove("active");
        reset();
    });

    restartBtn.addEventListener("click", () => {
        audio.tick();
        winOverlay.classList.remove("active");
        reset();
    });

    winNext.addEventListener("click", () => {
        audio.tick();
        winOverlay.classList.remove("active");
        reset();
    });

    let resizeRaf = null;
    window.addEventListener("resize", () => {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => {
            computeSizes();
            draw();
            placePieces();
            game.querySelectorAll(".trail").forEach(t => t.remove());
            visited.forEach(key => {
                const [tx, ty] = key.split(",").map(Number);
                if (tx === x && ty === y) return;
                addTrail(tx, ty);
            });
        });
    });

    loadBest();
    applyLang();
    reset();

    if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
            try {
                await navigator.serviceWorker.register("../../sw.js");
                const reg = await navigator.serviceWorker.ready;
                const sw  = reg.active || navigator.serviceWorker.controller;
                if (sw) sw.postMessage({ type: "ensure-cache" });
            } catch (_) {}
        });
    }
</script>

</body>
