<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mini Games</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 0.3rem;
            text-align: center;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 2.5rem;
            text-align: center;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 360px;
        }

        .game-card {
            display: block;
            padding: 20px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: white;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }

        .game-card:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .game-card:active {
            transform: translateY(0);
        }

        .game-card h2 {
            margin: 0 0 6px;
            font-size: 1.3rem;
        }

        .game-card p {
            margin: 0;
            color: #bbb;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<h1>Mini Games</h1>
<p class="subtitle">Обери гру</p>

<nav class="menu">
    <a class="game-card" href="games/maze/index.html">
        <div class="icon">🌀</div>
        <h2>Лабіринт</h2>
        <p>Знайди вихід зі стін. Чим швидше — тим краще!</p>
    </a>

    <a class="game-card" href="games/first-million/index.html">
        <div class="icon">💰</div>
        <h2>Перший мільйон</h2>
        <p>Вікторина на зразок «Хто хоче стати мільйонером?»</p>
    </a>
</nav>

</body>
</html>
