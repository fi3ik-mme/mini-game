<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Maze Game Levels</title>

    <style>
        body {
            margin: 0;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial;
            color: white;
            touch-action: manipulation;
        }

        #game {
            position: relative;
            width: 300px;
            height: 300px;
            background: #333;
            border: 4px solid white;
            margin-top: 10px;
        }

        #player {
            position: absolute;
            width: 28px;
            height: 28px;
            background: red;
            border-radius: 6px;
        }

        #goal {
            position: absolute;
            width: 30px;
            height: 30px;
            background: limegreen;
            border-radius: 6px;
        }

        .wall {
            position: absolute;
            background: #888;
        }

        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 80px 80px 80px;
            grid-template-rows: 80px 80px;
            gap: 10px;
        }

        button {
            font-size: 28px;
            border: none;
            border-radius: 16px;
            background: #444;
            color: white;
            user-select: none;
            touch-action: none;
        }

        button:active {
            background: #777;
        }

        #up { grid-column: 2; }
        #left { grid-column: 1; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
    </style>
</head>

<body>

<h2 id="levelTitle">Level 1</h2>

<div id="game">
    <div id="player"></div>
    <div id="goal"></div>
</div>

<div class="controls">
    <button id="up">⬆️</button>
    <button id="left">⬅️</button>
    <button id="down">⬇️</button>
    <button id="right">➡️</button>
</div>

<script>
    const game = document.getElementById("game");
    const player = document.getElementById("player");
    const goal = document.getElementById("goal");
    const levelTitle = document.getElementById("levelTitle");

    let x = 5, y = 5;
    const speed = 2;

    let keys = {};
    let level = 0;

    const levels = [
        // Level 1 walls
        [
            {left:60, top:0, width:20, height:220},
            {left:120, top:80, width:20, height:220},
        ],
        // Level 2 walls (harder)
        [
            {left:40, top:0, width:20, height:200},
            {left:100, top:100, width:20, height:200},
            {left:160, top:0, width:20, height:200},
            {left:220, top:100, width:20, height:200},
        ]
    ];

    function loadLevel(lvl) {
        game.querySelectorAll(".wall").forEach(w => w.remove());

        levels[lvl].forEach(w => {
            const div = document.createElement("div");
            div.className = "wall";
            div.style.left = w.left + "px";
            div.style.top = w.top + "px";
            div.style.width = w.width + "px";
            div.style.height = w.height + "px";
            game.appendChild(div);
        });

        x = 5; y = 5;
        goal.style.left = "260px";
        goal.style.top = "260px";

        levelTitle.innerText = "Level " + (lvl + 1);
    }

    function collides(nx, ny) {
        const playerRect = { left:nx, top:ny, right:nx+28, bottom:ny+28 };

        for (let w of document.querySelectorAll(".wall")) {
            const wr = {
                left: w.offsetLeft,
                top: w.offsetTop,
                right: w.offsetLeft + w.offsetWidth,
                bottom: w.offsetTop + w.offsetHeight
            };

            if (
                playerRect.left < wr.right &&
                playerRect.right > wr.left &&
                playerRect.top < wr.bottom &&
                playerRect.bottom > wr.top
            ) return true;
        }
        return false;
    }

    function move(dx, dy) {
        let nx = x + dx;
        let ny = y + dy;

        if (nx < 0 || ny < 0 || nx > 272 || ny > 272) return;
        if (collides(nx, ny)) return;

        x = nx; y = ny;
        player.style.left = x + "px";
        player.style.top = y + "px";

        checkWin();
    }

    function checkWin() {
        if (Math.abs(x - goal.offsetLeft) < 20 &&
            Math.abs(y - goal.offsetTop) < 20) {

            setTimeout(() => {
                level++;

                if (level >= levels.length) {
                    alert("You finished all levels!");
                    level = 0;
                } else {
                    alert("Level complete!");
                }

                loadLevel(level);
            }, 100);
        }
    }

    /* HOLD CONTROLS */
    function holdButton(btn, dx, dy) {
        let interval;

        const start = () => interval = setInterval(() => move(dx, dy), 10);
        const stop = () => clearInterval(interval);

        btn.addEventListener("mousedown", start);
        btn.addEventListener("touchstart", start);

        btn.addEventListener("mouseup", stop);
        btn.addEventListener("mouseleave", stop);
        btn.addEventListener("touchend", stop);
    }

    /* Mobile buttons */
    holdButton(document.getElementById("up"), 0, -speed);
    holdButton(document.getElementById("down"), 0, speed);
    holdButton(document.getElementById("left"), -speed, 0);
    holdButton(document.getElementById("right"), speed, 0);

    /* Keyboard hold */
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    function gameLoop() {
        if (keys["ArrowUp"]) move(0, -speed);
        if (keys["ArrowDown"]) move(0, speed);
        if (keys["ArrowLeft"]) move(-speed, 0);
        if (keys["ArrowRight"]) move(speed, 0);

        requestAnimationFrame(gameLoop);
    }

    loadLevel(level);
    gameLoop();

</script>

</body>
</html>
